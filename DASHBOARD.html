<style>
:root {
  --bg: #09090b; --bg2: #18181b; --bg3: #27272a;
  --border: #3f3f46; --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
  --accent: #3b82f6; --accent2: #10b981; --accent3: #8b5cf6;
  --warn: #f59e0b; --err: #ef4444;
  --radius: 10px; --radius-sm: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* ── Header ────────────────────────────────────────────────────────────── */
.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header h1 {
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 8px;
}
.header .meta { color: var(--text3); font-size: 11px; }
.header .stats { display: flex; gap: 4px; }
.header .stat {
  text-align: center; padding: 4px 10px;
  border-radius: var(--radius-sm); background: var(--bg3); min-width: 60px;
}
.header .stat .val { font-size: 16px; font-weight: 700; }
.header .stat .lbl { font-size: 8px; text-transform: uppercase; color: var(--text3); }
.header .stat.green .val { color: var(--accent2); }
.header .stat.red .val { color: var(--err); }
.header .stat.amber .val { color: var(--warn); }
.header .stat.purple .val { color: var(--accent3); }
.header .stat.blue .val { color: var(--accent); }

/* ── Main ──────────────────────────────────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── Canvas ────────────────────────────────────────────────────────────── */
.canvas-area { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
#bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }

/* ── Breadcrumb ────────────────────────────────────────────────────────── */
.breadcrumb {
  position: absolute; top: 12px; left: 12px; z-index: 50;
  display: flex; gap: 4px; align-items: center;
}
.bc-item {
  background: rgba(9,9,11,0.9); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px;
  color: var(--text3); cursor: pointer; transition: all 0.2s;
  font-weight: 500; backdrop-filter: blur(8px);
}
.bc-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.bc-item.active { color: var(--accent); border-color: var(--accent); }
.bc-sep { color: var(--text3); font-size: 10px; }

/* ── Back Button ───────────────────────────────────────────────────────── */
.back-btn {
  position: absolute; top: 12px; left: 12px; z-index: 50;
  background: rgba(9,9,11,0.9); border: 1px solid var(--accent);
  border-radius: var(--radius-sm); padding: 5px 12px; font-size: 11px;
  color: var(--accent); cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: none; font-weight: 500;
  backdrop-filter: blur(8px);
}
.back-btn:hover { background: var(--accent); color: var(--bg); transform: translateX(-2px); }
.back-btn.visible { display: flex; align-items: center; gap: 6px; }

/* ── Legend ─────────────────────────────────────────────────────────────── */
.canvas-overlay {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  display: flex; gap: 6px; pointer-events: none;
}
.canvas-legend {
  background: rgba(9,9,11,0.92); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 10px; font-size: 10px;
  display: flex; gap: 10px; align-items: center; pointer-events: auto;
  backdrop-filter: blur(8px);
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Side Panel ────────────────────────────────────────────────────────── */
.side-panel {
  width: 400px; background: var(--bg2); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.tab-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 4px; }
.tab-btn {
  flex: 1; padding: 10px 6px; background: transparent; border: none;
  color: var(--text3); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
  border-bottom: 2px solid transparent;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-content {
  flex: 1; overflow-y: auto; padding: 16px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.tab-content::-webkit-scrollbar { width: 4px; }
.tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.tab-pane { display: none; animation: fadeIn 0.3s ease; }
.tab-pane.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Cards ─────────────────────────────────────────────────────────────── */
.section-title {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.ov-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; text-align: center;
  transition: all 0.2s;
}
.ov-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.ov-card .val { font-size: 22px; font-weight: 700; }
.ov-card .lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

.integrity-bar {
  height: 6px; border-radius: 3px; overflow: hidden;
  display: flex; margin-bottom: 16px; background: var(--bg3);
}

.proj-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 6px;
  cursor: pointer; transition: all 0.2s;
}
.proj-card:hover { border-color: var(--accent); transform: translateX(4px); }
.proj-card .proj-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.proj-card .proj-name { font-size: 13px; font-weight: 600; }
.proj-card .proj-pct { font-size: 13px; font-weight: 700; }
.proj-card .proj-bar { height: 3px; border-radius: 2px; background: var(--bg); overflow: hidden; margin-bottom: 8px; }
.proj-card .proj-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.proj-card .proj-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text3); flex-wrap: wrap; }
.proj-card .proj-tag { background: var(--bg); border-radius: 3px; padding: 1px 5px; border: 1px solid var(--border); }

.thread-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 6px;
  cursor: pointer; transition: all 0.2s;
}
.thread-card:hover { border-color: var(--accent); transform: translateX(4px); }
.thread-card .thread-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.thread-card .thread-title { font-size: 12px; font-weight: 500; flex: 1; }
.thread-card .thread-platform {
  font-size: 9px; padding: 2px 6px; border-radius: 3px;
  text-transform: uppercase; font-weight: 600; flex-shrink: 0;
}
.thread-card .thread-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text3); }
.thread-card .thread-tag { background: var(--bg); border-radius: 3px; padding: 1px 5px; border: 1px solid var(--border); }
.thread-card .thread-snippet { font-size: 11px; color: var(--text2); margin-top: 6px; max-height: 40px; overflow: hidden; }

.msg-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
.msg-card .msg-role { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 4px; }
.msg-card .msg-role.user { color: var(--accent); }
.msg-card .msg-role.assistant { color: var(--accent3); }
.msg-card .msg-content { font-size: 12px; color: var(--text2); white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: hidden; line-height: 1.5; }

.commit-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; padding: 1px 6px; border-radius: 3px;
  font-weight: 600; background: rgba(16,185,129,0.1); color: var(--accent2);
  border: 1px solid rgba(16,185,129,0.2);
}

/* ── Tooltip ───────────────────────────────────────────────────────────── */
#tooltip {
  display: none; position: fixed; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; font-size: 11px; pointer-events: none;
  z-index: 100; max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
  animation: tooltipIn 0.15s ease;
}
@keyframes tooltipIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
#tooltip .tt-title { font-weight: 600; margin-bottom: 6px; font-size: 12px; }
#tooltip .tt-row { display: flex; justify-content: space-between; color: var(--text3); padding: 1px 0; }

/* ── Detail Panel ──────────────────────────────────────────────────────── */
.detail-panel {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 16px; max-height: 50%; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 60;
}
.detail-panel.visible { transform: translateY(0); }
.detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.detail-title { font-size: 14px; font-weight: 600; }
.detail-close {
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px 8px; color: var(--text3);
  cursor: pointer; font-size: 11px; transition: all 0.2s;
}
.detail-close:hover { border-color: var(--err); color: var(--err); }
</style>
</head>

r auf dem PATH noch in `$LOCALAPPDATA/Programs`; per `export GODOT_BIN=\"…\"` setzen.\n- `--headless --path . --quit-after 2` = Main-Scene-Smoke-Test; `--headless --path . --script res://scripts/preflight.gd` = persistente Testsuite (kein externes GUT). Temporäre Lifecycle-Checks nutzen `res://.tmp_*.gd` und müssen nach Abschluss restlos entfernt werden (inklusive generiertem `.tmp_*.gd.uid`-Sidecar).\n- Preflight gibt am Ende `ERROR: …RID allocations… leaked at exit` / `ObjectDB instances leaked` aus — das ist normales Teardown-Rauschen des Dummy-Renderers im Headless-Modus. Verbindlich ist die Zeile `RESULT: PASSED`.\n- Der Headless-Modus nutzt den Dummy-Renderer, daher ist `Window.get_texture()` null; visuelle Screenshots/Captures benötigen den Desktop Compatibility/OpenGL-Renderer, und `Window.size` muss nach Szenen-Initialisierung explizit gesetzt werden.\n- Ein Headless-Editor-Scan kann mit Exit-Code 0 enden, selbst wenn ein `EditorFileServer` Port-6010-Konflikt den Scan-Thread abbricht. Verlässlicher Maßstab sind Preflight + Smoke-Test. Render-Budget-Assertions schätzen CanvasItem-Submissions, nicht GPU-Framezeiten.\n\n## Preflight-Suite Architektur & Verträge\n- **Preflight ist modular aufgebaut:** `scripts/preflight.gd` ist der Orchestrator. Er instanziiert einen `PreflightContext` sowie eine `PreflightFixture` und führt die Module aus `CONSTRAINT_REGISTRY` aus.\n- **Registrierung:** Neue Constraints werden als eigene `PreflightConstraintX`-Klasse mit `constraint_name() -> String` und `run(ctx: PreflightContext) -> bool` implementiert und in `CONSTRAINT_REGISTRY` in `scripts/preflight.gd` registriert (`{\"id\": \"...\", \"script\": preload(\"...\"), \"desc\": \"...\", \"requires_scene\": bool}`).\n- **Fixture-Isolation:** Szenenabhängige Constraints (`requires_scene: true`) erhalten über `ctx.fixture.boot_default(ctx)` eine isolierte Szenen-Fixture. Jeder Boot räumt die vorherige Szene auf und setzt `GameState` aus dem aktiven Katalog zurück. Constraints dü es`-Snapshots auf GameState anwendet, ohne die Snapshot-Ressource zu verändern. `MechanicRegistry` entdeckt alle Spielmechaniken via Reflection (`GameState.get_signal_list()`), `ScenarioSnapshot` kapselt Metadaten + Coverage, `ScenarioLoader` lädt und wendet an. Preflight-Constraint `mechanic_coverage` validiert automatisch: entdeckte Mechaniken haben Beschreibung + Domäne, Test-Modelle existieren, Scenario-Files sind valide. Neue Mechaniken werden automatisch erkannt und gemeldet. Doku: `scripts/testing/SCENARIO_LOADER_SPEC.md`.\n\n## Architektur & System-Verträge\n- **Szenen-Architektur (3 Spiele, 1 SSO):** Das Spiel ist in vier bootbare Szenen getrennt, die sich GameState als SSO teilen und über den `SceneDirectorService`-Autoload wechseln:\n  - `scenes/main_menu/main_menu.tscn` (Einstieg; `run/main_scene`): Neues Spiel / Weiter / Beenden.\n  - `scenes/world/world.tscn` (Layer 1, Strategie-Overworld): `WorldBootstrap`-Wurzel + `Background`-Renderer + `PlanetField` + `MeteorField` + `MapCamera` + `PauseMenu`.\n  - `scenes/battle/battle_scene.tscn` (Layer 2, Flotten-Replay).\n  - `scenes/conquest/conquest_scene.tscn` (Layer 3, Eroberungs-Replay).\n  - `SceneDirectorService` führt Szenen-Wechsel über den dokumentierten Custom-Switcher aus (deferred free + add_child + `current_scene`), nicht `change_scene_to_packed`. `GameCycleManager` entscheidet WANN gewechselt wird, der Director WIE. Kontext wandert ausschließlich über GameState (`pending_battle_context` / `request_world_reconnect` / `RunSession`).\n- **Geteilte WorldConfig:** `WorldBootstrap._enter_tree()` (Wurzel von `world.tscn`) wählt das Szenario, finalisiert `layout_seed` (`_finalize_layout_seed`) und generiert `active_catalog`, bevor `GameState`, `PlanetField` und `MeteorField` initialisiert werden. `Bootstrap._ready()` dealt die Ressourcen mit diesem finalisierten Seed. Der `Background`-Renderer (`starfield_background.gd`) ist reine Optik und berührt weder GameState noch Katalog oder Szenario.\n- **Save/Load (Godot-Resource):** `SaveGameService` (Autoload) schreibt `RunSaveData`-Snapshots nach `user://saves/run_<slot>.tres` (atomar via `_tmp.tres` + Rename). `GameState.snapshot_run()`/`restore_run()` erfassen/restaurieren alle vier Domains, Transits, Chunk-Daten und Timer. `load_run()` setzt `_reconnect_requested`, die World bootet danach über `reconnect_world()` mit der gespeicherten Session; `SeededLayout` lädt den Chunk-Payload vor der Instanziierung. Auto-Save bei `NOTIFICATION_WM_CLOSE_REQUEST` — nie im Headless-Modus (`OS.has_feature(\"headless\")`-Guard), sonst schreibt die Preflight-Suite/der pre-commit-Hook Testzustand über echte Spielstände.\n- **Slot-Konvention:** Das Spiel nutzt ausschließlich Slot 0 (PauseMenu-Save, MainMenu-Continue, Auto-Save). Die Preflight-Suite darf Slot 0 nie zerstören: `constraint_main_menu_and_flow` sichert/restauriert den echten Save via Backup (backup/restore-Vertrag, empirisch verifiziert), `constraint_save_game_roundtrip` nutzt Test-Slot 7, `constraint_save_game_slots` die Slots 1–2. Neue Save-Tests müssen sich an diese Konvention halten (Slots 1–7 = Test-Slots, Slot 0 = echter Spielstand).\n- **Single-Source Weltgenerierung:** `WorldGenerator.generate_catalog(config, active_layout_seed, target_planet_count)` erzeugt den Sektor-Katalog genau einmal (`p0`/`p1` = Homeworlds von Spieler `a` und CPU `b`, `p2`..`p9` = neutrale Welten aus Baustein-Texturen). `SeededLayout` darf den Katalog nicht neu generieren.\n- **Homeworld-Separation:** `SeededLayout._separate_homeworlds()` hält die beiden Homeworlds nicht-benachbart, sodass jede mindestens 2 neutrale Nachbarn für Scouts und Expansion besitzt.\n- **Raster- & Nachbarschaftsauflösung:** Adjazenz und Dimensionen werden ausschließlich über `WorldConfig.resolved_columns()`, `resolved_size_class_counts()`, `resolved_design_size()` und `resolved_target_planet_count()` bezogen — niemals über rohes `columns`.\n- **Planeten-Lebenszyklus & Detail-Profile:** `Planet.layout_size` leitet sich n-Intel, Starter-Scout.\n  - `EconomyDomain`: Faction-Vaults, Ressourcen-Deals, Upgrades, Worker-Factories, persistente Gatherer.\n  - `TechDomain`: Globale & planetare Technologien, Forschungs-Jobs, Voraussetzungen.\n  - `ShipDomain`: Teile-Inventare, Schiffsmontage (`assemble_ship`), Zerlegung, Bau-Jobs, FleetSnapshots.\n- **Ressourcen & Overdraft-Schutz:** Ressourcen sind unsichtbare `GameResource`-Datenobjekte aus dem `ResourcePool`. `spend_faction_resource()` blockiert bei unzureichendem Guthaben vollständig (kein Overdraft, keine Teilzahlung).\n- **Wirtschaft & Sammeltrupps:** Der Economy-Timer (10s) läuft erst nach `worker_automation`. Ein separater Gather-Timer (10s) läuft dauerhaft: `collect`-Missionen registrieren persistente Gatherer in `GameState._gathering_workers`, die pro Tick `workers × resource_base` einbringen.\n- **Navigation & Routing:** Pro Nachbarschaftskante existiert ein Moon-/Comet-Waypoint, überlagert von einem K-Nearest-Langstreckengraph (`NavigationField`). `NavigationField.find_route()` liefert den Pfad für Flugvorschau und Transit.\n- **Flugzeit & Cluster-Packing:** `FlightTime.seconds_for()` berechnet die Dauer basierend auf Distanz, Einheitenlast und Quell-Transfer-Speed. Worker-Transit packt nach Largest-First (K=1, M=5, L=100); alle Gruppen starten im selben Frame.\n- **UI-Stack:**\n  - `PlanetNetworkUI` (CanvasLayer 50): Komponiert `VaultBar` (`scenes/ui/vault_bar.tscn`) und `PlanetPanel` (`scenes/ui/planet_panel.tscn`).\n  - `TechnologyMenu` (CanvasLayer 60): Unterteilt in `TechResearchView`, `TechScoutView`, `TechShipBuilderView` und `TechPlanetView`. Schließt das PlanetPanel bei Öffnung.\n  - `DossierLauncher` (CanvasLayer 40): Drei Buttons (PLANET/WERKSTATT/FORSCHUNG) links oben, öffnen modale Dossier-Views via `ModalCoordinator`. Position y=48 (unter VaultBar).\n  - `FleetOverview` (CanvasLayer 38): Linksseitiges Schnellzugriffs-Panel für aktive Ships und selektierte Planeten, über `ConflictManager.ship_dispatched`/`ship_arrived`-Signals live aktualisiert.\n  - `PauseMenu` (CanvasLayer 70): Reagiert auf ESC (`PROCESS_MODE_ALWAYS`), wenn weder PlanetPanel noch TechMenu geöffnet sind. Bietet **SPEICHERN** (→ `SaveGameService.save_run(0)` + EventLog-Toast) und **HAUPTMENÜ** (→ erst unpausen, dann `SceneDirectorService.goto_scene(\"menu\")` — ein Scene-Wechsel im gepausten Baum würde das neue Menü einfrieren). Beide Buttons tragen stabile Namen (`Content/SaveButton`, `Content/MenuButton`) und sind über `constraint_pause_and_context` abgesichert.\n  - `MainMenu` (Einstiegsszene, `run/main_scene`): **NEUES SPIEL** (löscht Slot 0, `GameState.request_new_run()`, dann World), **WEITER** (deaktiviert ohne Save; `SaveGameService.load_run(0)` setzt `_reconnect_requested`, dann World), **BEENDEN**. Flow ist über `constraint_main_menu_and_flow` + `constraint_context_handover` abgesichert.\n- **Flottenkampf & Eroberung (Layer 2/3):**\n  - Layer 2: `FleetBattleSimulator` (deterministischer, getakteter `RefCounted`-Simulator) + `BattleScene` + `IngamePlayerControls`.\n  - Layer 3: `ConquestSimulator` (deterministischer `RefCounted`-Simulator für planetare Eroberung) + `ConquestScene`.\n  - `ConquestSimulator.simulate_conquest` darf HP/DPS-Konstanten nicht ändern — die bestehenden Layer-2/3-Preflight-Assertions koppeln exakt darauf. Nur `tick`/`max_time`/`variance` parametrisieren.\n  - Orchestrierung erfolgt über `ConflictManager` auf `PlanetField` und den `SceneDirector`.\n- **Prozedurale Chunk-Welt (Unendlich):**\n  - Wird aktiviert, wenn `WorldConfig.chunk_size > 0`. Beide Shipped-Szenarien sind bereits unendlich: `world_default.tres` (`chunk_size = 3`), `world_wide.tres` (`chunk_size = 4`); `chunk_size = 0` wäre der endliche Pfad.\n  - Verwaltet durch `ChunkCoordinator` (Lazy-Generierung, Cache, sicheres Cycling) und getestet in Constraint `chunk_expansion`.\n  - `SeededLayout.set_layout_seed()` ist im unendlichen Pfad kein billiger Setter, sondern ein Voll-Reset: ruft `GameState.reset_for_infinite_world()` + `reset_for_layout_seed` (leert Chunk-Cache) und deferred `_refresh_chunks` — regeneriert die ganze Chunk-Welt. `constraint_resources_and_seed` ruft das zweimal auf (Seed ±1, dann zurück) und ist deshalb der langsamste Szenen-Constraint (~9–10 s).\n- **EventLog:** Autoload `/root/EventLog`. `push()` sendet sichtbare Toasts an das `MessageFeed`, `log_silent()` protokolliert geräuschlos. Export nach `user://player.log` erfolgt erst bei Anwendungsbeendigung (`NOTIFICATION_WM_CLOSE_REQUEST`).\n\n## Atomare Commit-Gruppen (Change Together)\n- **Transit & Dispatch:** `flight_time.gd`, `dispatch.gd`, Transit-/Tier-Configs, `planet_network.gd`, `planet_network_ui.gd`, `ui_theme_config.gd`, `worker_cluster.*`, `worker_manager.gd`, `planet.gd`, `game_state.gd`, `preflight.gd`.\n- **Navigation:** `navigation_field.gd`, `navigation_waypoint.gd`, `seeded_layout.gd`, `planet_network.gd`, `worker_manager.gd`, `preflight.gd`.\n- **Planeten & Katalog:** `planet.tscn`, `planet.gd`, `planet_details.gd`, `planet_arrival_resolver.gd`, `planet_trait_aggregator.gd`, `planet_view.gd`, `planet_procedural.gd`, `seeded_layout.gd`, Welt-/Größen-/Detail-Configs & SVGs.\n- **GameState & Ressourcen:** `game_state.gd`, Domänen-Manager (`scripts/state/domains/*`), `planet.gd`, `seeded_layout.gd`, `resource_pool*.tres`, `bootstrap.gd`, `starfield_background.gd`, `preflight.gd`.\n- **Wirtschaft & CPU-AI:** `economy_config.gd`+`.tres`, `cpu_dispatch_config.gd`+`.tres`, `economy_manager.gd`, `cpu_dispatch_ai.gd`, `seeded_layout.gd`, `planet.gd`, `worker_manager.gd`, `preflight.gd`.\n- **Schiffsbau & Forschung:** `ship_part_definition.gd`, `ship_component_variant.gd`, `ship_blueprint.gd`, `ship_part_catalog.gd`+`.tres`, `technology_definition.gd`, `technology_catalog*.tres`, `ship_manager.gd`, `shipyard_hangar.gd`, `composite_ship_view.gd`, `technology_menu.gd`, Sub-Views (`scripts/ui/tech_menu/*`), `preflight.gd`.\n- **Kampf & Simulation (Layer 2/3):** `fleet_battle_simulator.gd`, `conquest_si \n## Godot-Entwicklungsregeln & Fallstricke\n- Godot 4.7 `@export_enum` benötigt String-/Integer-kompatible Typen, nicht `StringName`.\n- Resource- und Waypoint-Skripte, die von `@tool`-Skripten genutzt werden, müssen ebenfalls `@tool` sein.\n- `NavigationWaypoint.configure()` kann vor `_enter_tree()` laufen; nicht auf `@onready` verlassen und Node vor Zuweisung der globalen Position in den Baum einhängen.\n- `MultiMeshInstance2D` erfordert zwingend `MultiMesh.mesh` (z.B. `QuadMesh`) vor dem Setzen von `instance_count`.\n- Meteor-Größen sind pixelbasiert; `meteor_field.gd` skaliert über die SVG-Texturbreite.\n- `SceneTree.quit()` beendet Funktionen nicht sofort; Testskripte müssen nach `quit()` explizit ein `return` ausführen.\n- Headless-Läufe können `.tscn` und `.tres` Dateien formatieren und `uid=` Tags injizieren; vor Commits immer `git status` und `git diff` prüfen.\n- `.uid`-Sidecars (`*.gd.uid`, `*.gdshader.uid`) sind versioniert (nicht in `.gitignore`) und müssen bei neuen Scripts/Shadern mitcommittet werden; fehlende Sidecars führen zu Drift/Neuvergabe der UIDs.\n- Neue `class_name`-Skripte erfordern einen Editor-Scan (`$GODOT_BIN --headless --path . --editor --quit`), um in `.godot/global_script_class_cache.cfg` registriert zu werden.\n- GDScript `:=` Typinferenz schlägt bei `Node`-Kindern und untypisierten Helper-Returns fehl; explizite Casts verwenden (z.B. `(node as Node2D)`).\n- `Node.name` liefert `StringName`, nicht `String`. Bei String-Operationen mit `String(node.name)` konvertieren.\n- Lokale Variablen und Signal-Parameter dürfen keine Engine-Properties (`visible`, `owner`) oder Instanzfelder shadowen (`SHADOWED_VARIABLE`).\n- GDScript kennt kein `sqrtf`/`powf` (C-Namen); Fließkomma-Mathe nutzt `sqrt()`/`pow()` — `sqrtf` erzeugt einen Lookup-/Parse-Fehler.\n- Prozedural generierte Texture-Maps: `Image.create()` + `Image.set_pixel()` + `ImageTexture.create_from_image()` funktionieren zum Erzeugen von Selektionsringen, Markern etc. ohne externe Asse script res://addons/gdscript_mcp/testing/e2e/mcp_playthrough_driver.gd [--mcp-e2e=<scenario>|--mcp-e2e-list]` — setzt die exact gleichen Tool-Calls ein wie ein externer Agent; `runtime_e2e_run` (async, über TCP/stdio gleiche Szenen).\n- **Klicks:** `runtime_click` sendet Motion (1 Frame vorher) + Press + Release über `Viewport.push_input` (default `inject_mode=push`, Viewport-Koordinaten) bzw. `Input.parse_input_event` (`parse`-Mode, Screen-Transform für skalierte Viewports). Release wird um `hold_frames` verzögert; KEIN Windows-API-Click, funktioniert unfokussiert.\n- **Bilder:** MCP-Image-Content (Standard: `{type:\"image\",data,mimeType}`) + lokaler Kontext-Pfad (`user://mcp_context`, TTL 45s, max 6). Externe Worker (Python, Node) lesen **lokal von Disk** (`vision_worker.py`), kein Base64-Roundtrip nötig.\n- **Screenshots:** Nach dem Konsum löschen/ablaufen (TTL, `runtime_context_release`, `runtime_context_cleanup`); Server räumt beim Lifecycle-Tick selbst auf.\n- **Watch-Clock:** `runtime_ux_watch_start` ist ereignisgesteuert (Signatur-Delta der sichtbaren Controls) — keine Continuous-Full-Analyse, minimaler Overhead.\n- **Playability-Tests:** `McpE2E`-Szenarien sammeln `anomalies[]` aus EventLog (Fehler/Warnungen) — Auffälligkeiten werden während des Laufs lokalisiert. Szenarien triggern echte Spielmechaniken (z.B. `research_start`: FORSCHUNG → FORSCHEN → `GameState.research_technology`) und persistieren erfolgreiche Läufe in der Playthrough-Archiv-DB (`user://mcp_playthrough/`, JSONL + Frame-PNGs + `.tres`-Presets).\n- **Playthrough-Archiv (`runtime/context/mcp_playthrough_archive.gd`):** lokale Erfolgs-/Kontextspeicherung für autonomes Weiterspielen über Sessions. Jede erfolgreiche Aktion (explizit via `runtime_playthrough_success` oder automatisch nach E2E-Szenario-PASS) wird mit Snapshot-Bild und `GameState.snapshot_run()`-Preset (`.tres`) abgelegt; `runtime_playthrough_search/latest/stats/frames` lesen sie aus, `runtime_playthrough_preset_load` stellt reproduzierbare Situationen via `restore_run()` wieder her (World reconnect beim nächsten Boot). Alle Daten lokal unter `user://mcp_playthrough/`.\n- **Fallstricke:** Headless-Dummy-Renderer liefert keine echten Screenshots (`get_image()` crasht bei null RID); `runtime_wait_ms` nutzt Pause-ignorante Engine-Timer; Klick-Positionen bei skalierten Viewports rechnen über die Screen-Transform.\n\n## Atomare Commit-Gruppen (Change Together)\n- **Transit & Dispatch:** `flight_time.gd`, `dispatch.gd`, Transit-/Tier-Configs, `planet_network.gd`, `planet_network_ui.gd`, `ui_theme_config.gd`, `worker_cluster.*`, `worker_manager.gd`, `planet.gd`, `game_state.gd`, `preflight.gd`.\n- **Navigation:** `navigation_field.gd`, `navigation_waypoint.gd`, `seeded_layout.gd`, `planet_network.gd`, `worker_manager.gd`, `preflight.gd`.\n- **Planeten & Katalog:** `planet.tscn`, `planet.gd`, `planet_details.gd`, `planet_arrival_resolver.gd`, `planet_trait_aggregator.gd`, `planet_view.gd`, `planet_procedural.gd`, `seeded_layout.gd`, Welt-/Größen-/Detail-Configs & SVGs.\n- **GameState & Ressourcen:** `game_state.gd`, Domänen-Manager (`scripts/state/domains/*`), `planet.gd`, `seeded_layout.gd`, `resource_pool*.tres`, `bootstrap.gd`, `starfield_background.gd`, `preflight.gd`.\n- **Wirtschaft & CPU-AI:** `economy_config.gd`+`.tres`, `cpu_dispatch_config.gd`+`.tres`, `economy_manager.gd`, `cpu_dispatch_ai.gd`, `seeded_layout.gd`, `planet.gd`, `worker_manager.gd`, `preflight.gd`.\n- **Schiffsbau & Forschung:** `ship_part_definition.gd`, `ship_component_variant.gd`, `ship_blueprint.gd`, `ship_part_catalog.gd`+`.tres`, `technology_definition.gd`, `technology_catalog*.tres`, `ship_manager.gd`, `shipyard_hangar.gd`, `composite_ship_view.gd`, `technology_menu.gd`, Sub-Views (`scripts/ui/tech_menu/*`), `preflight.gd`.\n- **Kampf & Simulation (Layer 2/3):** `fleet_battle_simulator.gd`, `conquest_simulator.gd`, `battle_scene.gd`, `conquest_scene.gd`, `composite_ship_view.gd`, `ingame_player_controls.gd`, `scene_ e.gd` | `runtime_e2e_list`, `runtime_e2e_run` (5 Szenarien: `main_menu`, `new_game_to_world`, `tech_menu_open_close`, `pause_save_menu`, `research_start`) |\n| **Playthrough Archive** | `mcp_playthrough_tools.gd` | `runtime_playthrough_success` (erfolgreiche Aktionen + Snapshot + Frame speichern), `runtime_playthrough_search/latest/stats/frames`, `runtime_playthrough_preset_load` (GameState restore), `runtime_playthrough_compare` (A/B Diff) |\n\n### Besondere Features\n\n1. **Input ohne Fokus** – `Viewport.push_input` + `Input.parse_input_event` (mit Screen-Transform für skalierte Viewports). Funktioniert auch wenn Fenster im Hintergrund ist.\n\n2. **Screenshots als lokale Artefakte** – Werden nach `user://mcp_context/` (TTL 45s, max 6) geschrieben. MCP gibt nur Metadaten zurück (Pfad, ID, Dimensionen). Externe Worker (Python `vision_worker.py`) lesen **von Disk**, kein Base64-Roundtrip.\n\n3. **Headless-Erkennung** – Server **verweigert Start** bei `--headless` oder `OS.has_feature(\"headless\")`, weil Dummy-Renderer keine echten Screenshots liefert (`get_image()` crasht bei null RID).\n\n4. **Watch-Clock (UX)** – Event-getrieben: nur bei **Signature-Delta** der sichtbaren Controls wird neu analysiert (minimaler Overhead).\n\n5. **E2E Driver (sichtbar!)** – `testing/e2e/mcp_playthrough_driver.gd` startet das Spiel **fensterbasiert** (echter Renderer), instantiiert MainMenu selbst und fährt dieselben Tool-Calls wie ein externer Agent. Nutzung:\n   ```bash\n   $GODOT_BIN --path . --script res://addons/gdscript_mcp/testing/e2e/mcp_playthrough_driver.gd [--mcp-e2e=scenario_id|--mcp-e2e-list]\n   ```\n\n6. **Playthrough-Archiv** – Append-only JSONL unter `user://mcp_playthrough/` mit Frames (PNG) + GameState-Presets (`.tres`). Agent kann **über Sessions hinweg weiterspielen** (`runtime_playthrough_preset_load` → `GameState.restore_run()` → World reconnect beim nächsten Boot).\n\n### Starten\n```bash\n# Im Spiel (Autoload bootet Server automatisch):\n$GODOT_BIN --path .           "user": "[IMPORTANT: The user has invoked the \"architecture-diagram\" skill, indicating they want you to follow its instructions. The full skill content is loaded below.]\n\n---\nname: architecture-diagram\ndescription: \"Dark-themed SVG architecture/cloud/infra diagrams as HTML.\"\nversion: 1.0.0\nauthor: Cocoon AI (hello@cocoon-ai.com), ported by Hermes Agent\nlicense: MIT\ndependencies: []\nplatforms: [linux, macos, windows]\nmetadata:\n  hermes:\n    tags: [architecture, diagrams, SVG, HTML, visualization, infrastructure, cloud]\n    related_skills: [concept-diagrams, excalidraw]\n---\n\n# Architecture Diagram Skill\n\nGenerate professional, dark-themed technical architecture diagrams as standalone HTML files with inline SVG graphics. No external tools, no API keys, no rendering libraries — just write the HTML file and open it in a browser.\n\n## Scope\n\n**Best suited for:**\n- Software system architecture (frontend / backend / database layers)\n- Cloud infrastructure (VPC, regions, subnets, managed services)\n- Microservice / service-mesh topology\n- Database + API map, deployment diagrams\n- Anything with a tech-infra subject that fits a dark, grid-backed aesthetic\n\n**Look elsewhere first for:**\n- Physics, chemistry, math, biology, or other scientific subjects\n- Physical objects (vehicles, hardware, anatomy, cross-sections)\n- Floor plans, narrative journeys, educational / textbook-style visuals\n- Hand-drawn whiteboard sketches (consider `excalidraw`)\n- Animated explainers (consider an animation skill)\n\nIf a more specialized skill is available for the subject, prefer that. If none fits, this skill can also serve as a general SVG diagram fallback — the output will just carry the dark tech aesthetic described below.\n\nBased on [Cocoon AI's architecture-diagram-generator](https://github.com/Cocoon-AI/architecture-diagram-generator) (MIT).\n\n## Workflow\n\n1. User describes their system architecture (components, connections, technologies)\n2. Generate the HTML file following the design system below\n3. Save with `write_file` to a `.html` file (e.g. `~/architecture-diagram.html`)\n4. User opens in any browser — works offline, no dependencies\n\n### Output Location\n\nSave diagrams to a user-specified path, or default to the current working directory:\n```\n./[project-name]-architecture.html\n```\n\n### Preview\n\nAfter saving, suggest the user open it:\n```bash\n# macOS\nopen ./my-architecture.html\n# Linux\nxdg-open ./my-architecture.html\n```\n\n## Design System & Visual Language\n\n### Color Palette (Semantic Mapping)\n\nUse specific `rgba` fills and hex strokes to categorize components:\n\n| Component Type | Fill (rgba) | Stroke (Hex) |\n| :--- | :--- | :--- |\n| **Frontend** | `rgba(8, 51, 68, 0.4)` | `#22d3ee` (cyan-400) |\n| **Backend** | `rgba(6, 78, 59, 0.4)` | `#34d399` (emerald-400) |\n| **Database** | `rgba(76, 29, 149, 0.4)` | `#a78bfa` (violet-400) |\n| **AWS/Cloud** | `rgba(120, 53, 15, 0.3)` | `#fbbf24` (amber-400) |\n| **Security** | `rgba(136, 19, 55, 0.4)` | `#fb7185` (rose-400) |\n| **Message Bus** | `rgba(251, 146, 60, 0.3)` | `#fb923c` (orange-400) |\n| **External** | `rgba(30, 41, 59, 0.5)` | `#94a3b8` (slate-400) |\n\n### Typography & Background\n- **Font:** JetBrains Mono (Monospace), loaded from Google Fonts\n- **Sizes:** 12px (Names), 9px (Sublabels), 8px (Annotations), 7px (Tiny labels)\n- **Background:** Slate-950 (`#020617`) with a subtle 40px grid pattern\n\n```svg\n<!-- Background Grid Pattern -->\n<pattern id=\"grid\" width=\"40\" height=\"40\" patternUnits=\"userSpaceOnUse\">\n  <path d=\"M 40 0 L 0 0 0 40\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"0.5\"/>\n</pattern>\n```\n\n## Technical Implementation Details\n\n### Component Rendering\nComponents are rounded rectangles (`rx=\"6\"`) with 1.5px strokes. To prevent arrows from showing through semi-transparent fills, use a **double-rect masking technique**:\n1. Draw an opaque background rect (`#0f172a`)\n2. Draw the semi-transparent styled rect on top\n\n### Connection Rules\n- **Z-Order:** Draw arrows *early* in the SVG (after the grid) so they render behind component boxes\n- **Arrowheads:** Defined via SVG markers\n- **Security Flows:** Use dashed lines in rose color (`#fb7185`)\n- **Boundaries:**\n  - *Security Groups:* Dashed (`4,4`), rose color\n  - *Regions:* Large dashed (`8,4`), amber color, `rx=\"12\"`\n\n### Spacing & Layout Logic\n- **Standard Height:** 60px (Services); 80-120px (Large components)\n- **Vertical Gap:** Minimum 40px between components\n- **Message Buses:** Must be placed *in the gap* between services, not overlapping them\n- **Legend Placement:** **CRITICAL.** Must be placed outside all boundary boxes. Calculate the lowest Y-coordinate of all boundaries and place the legend at least 20px below it.\n\n## Document Structure\n\nThe generated HTML file follows a four-part layout:\n1. **Header:** Title with a pulsing dot indicator and subtitle\n2. **Main SVG:** The diagram contained within a rounded border card\n3. **Summary Cards:** A grid of three cards below the diagram for high-level details\n4. **Footer:** Minimal metadata\n\n### Info Card Pattern\n```html\n<div class=\"card\">\n  <div class=\"card-header\">\n    <div class=\"card-dot cyan\"></div>\n    <h3>Title</h3>\n  </div>\n  <ul>\n    <li>• Item one</li>\n    <li>• Item two</li>\n  </ul>\n</div>\n```\n\n## Output Requirements\n- **Single File:** One self-contained `.html` file\n- **No External Dependencies:** All CSS and SVG must be inline (except Google Fonts)\n- **No JavaScript:** Use pure CSS for any animations (like pulsing dots)\n- **Compatibility:** Must render correctly in any modern web browser\n\n## Template Reference\n\nLoad the full HTML template for the exact structure, CSS, and SVG component examples:\n\n```\nskill_view(name=\"architecture-diagram\", file_path=\"templates/template.html\")\n```\n\nThe template contains working examples of every component type (frontend, backend, database, cloud, security), arrow styles (standard, dashed, curved), security groups, region boundaries, and the legend — use it as your structural reference when generating diagrams.\n\n[Skill directory: C:\\Users\\Vannon\\AppData\\Local\\hermes\\skills\\creative\\architecture-diagram]\nResolve any relative paths in this skill (e.g. `scripts/foo.js`, `templates/config.yaml`) against that directory, then run them with the terminal tool using the absolute path.\n\n[This skill has supporting files:]\n- templates\\template.html  ->  C:\\Users\\Vannon\\AppData\\Local\\hermes\\skills\\creative\\architecture-diagram\\templates\\template.html\n\nLoad any of these with skill_view(name=\"creative\\architecture-diagram\", file_path=\"<path>\"), or run scripts directly by absolute path (e.g. `node C:\\Users\\Vannon\\AppData\\Local\\hermes\\skills\\creative\\architecture-diagram/scripts/foo.js`).",

          "user": "[IMPORTANT: The user has invoked the \"codebase-inspection\" skill, indicating they want you to follow its instructions. The full skill content is loaded below.]\n\n---\nname: codebase-inspection\ndescription: \"Inspect codebases w/ pygount: LOC, languages, ratios.\"\nversion: 1.0.0\nauthor: Hermes Agent\nlicense: MIT\nplatforms: [linux, macos, windows]\nmetadata:\n  hermes:\n    tags: [LOC, Code Analysis, pygount, Codebase, Metrics, Repository]\n    related_skills: [github-repo-management]\nprerequisites:\n  commands: [pygount]\n---\n\n# Codebase Inspection with pygount\n\nAnalyze repositories for lines of code, language breakdown, file counts, and code-vs-comment ratios using `pygount`.\n\n## When to Use\n\n- User asks for LOC (lines of code) count\n- User wants a language breakdown of a repo\n- User asks about codebase size or composition\n- User wants code-vs-comment ratios\n- General \"how big is this repo\" questions\n\n## Prerequisites\n\n```bash\npip install --break-system-packages pygount 2>/dev/null || pip install pygount\n```\n\n## 1. Basic Summary (Most Common)\n\nGet a full language breakdown with file counts, code lines, and comment lines:\n\n```bash\ncd /path/to/repo\npygount --format=summary \\\n  --folders-to-skip=\".git,node_modules,venv,.venv,__pycache__,.cache,dist,build,.next,.tox,.eggs,*.egg-info\" \\\n  .\n```\n\n**IMPORTANT:** Always use `--folders-to-skip` to exclude dependency/build directories, otherwise pygount will crawl them and take a very long time or hang.\n\n## 2. Common Folder Exclusions\n\nAdjust based on the project type:\n\n```bash\n# Python projects\n--folders-to-skip=\".git,venv,.venv,__pycache__,.cache,dist,build,.tox,.eggs,.mypy_cache\"\n\n# JavaScript/TypeScript projects\n--folders-to-skip=\".git,node_modules,dist,build,.next,.cache,.turbo,coverage\"\n\n# General catch-all\n--folders-to-skip=\".git,node_modules,venv,.venv,__pycache__,.cache,dist,build,.next,.tox,vendor,third_party\"\n```\n\n## 3. Filter by Specific Language\n\n```bash\n# Only count Python files\npygount --suffix=py --format=summary .\n\n# Only count Python and YAML\npygount --suffix=py,yaml,yml --format=summary .\n```\n\n## 4. Detailed File-by-File Output\n\n```bash\n# Default format shows per-file breakdown\npygount --folders-to-skip=\".git,node_modules,venv\" .\n\n# Sort by code lines (pipe through sort)\npygount --folders-to-skip=\".git,node_modules,venv\" . | sort -t$'\\t' -k1 -nr | head -20\n```\n\n## 5. Output Formats\n\n```bash\n# Summary table (default recommendation)\npygount --format=summary .\n\n# JSON output for programmatic use\npygount --format=json .\n\n# Pipe-friendly: Language, file count, code, docs, empty, string\npygount --format=summary . 2>/dev/null\n```\n\n## 6. Interpreting Results\n\nThe summary table columns:\n- **Language** — detected programming language\n- **Files** — number of files of that language\n- **Code** — lines of actual code (executable/declarative)\n- **Comment** — lines that are comments or documentation\n- **%** — percentage of total\n\nSpecial pseudo-languages:\n- `__empty__` — empty files\n- `__binary__` — binary files (images, compiled, etc.)\n- `__generated__` — auto-generated files (detected heuristically)\n- `__duplicate__` — files with identical content\n- `__unknown__` — unrecognized file types\n\n## Pitfalls\n\n1. **Always exclude .git, node_modules, venv** — without `--folders-to-skip`, pygount will crawl everything and may take minutes or hang on large dependency trees.\n2. **Markdown shows 0 code lines** — pygount classifies all Markdown content as comments, not code. This is expected behavior.\n3. **JSON files show low code counts** — pygount may count JSON lines conservatively. For accurate JSON line counts, use `wc -l` directly.\n4. **Large monorepos** — for very large repos, consider using `--suffix` to target specific languages rather than scanning everything.\n\n[Skill directory: C:\\Users\\Vannon\\AppData\\Local\\hermes\\skills\\github\\codebase-inspection]\nResolve any relative paths in this skill (e.g. `scripts/foo.js`, `templates/config.yaml`) against that directory, then run them with the terminal tool using the absolute path.",

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let level = 'platforms';
let ctx = null;
let bgCtx = null;
let W = 0, H = 0;
let bubbles = [];
let particles = [];
let hovered = null;
let history = [];
let currentCtx = null;
let time = 0;
let transitionProgress = 1;
let transitionFrom = [];
let targetBubbles = [];

// ═══════════════════════════════════════════════════════════════════════════
// PARTICLES (background)
// ═══════════════════════════════════════════════════════════════════════════
function initParticles() {
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.3 + 0.1,
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;
  });
}

function drawParticles() {
  bgCtx.clearRect(0, 0, W, H);
  // Grid
  bgCtx.strokeStyle = 'rgba(255,255,255,0.02)';
  bgCtx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 50) {
    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, H); bgCtx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(W, y); bgCtx.stroke();
  }
  // Particles
  particles.forEach(p => {
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    bgCtx.fill();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BUBBLES
// ═══════════════════════════════════════════════════════════════════════════
function layoutBubbles(animate = false) {
  const prev = bubbles.map(b => ({x: b.x, y: b.y, r: b.r}));
  bubbles = [];

  if (level === 'platforms') {
    const total = DATA.platforms.reduce((s,p) => s + p.count, 0);
    DATA.platforms.forEach((p, i) => {
      const r = Math.sqrt(p.count / total) * Math.min(W, H) * 0.32;
      const angle = (i / DATA.platforms.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.28;
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: Math.max(r, 28), color: p.color, label: p.name,
        sub: p.count + ' Threads', data: p, type: 'platform',
        phase: Math.random() * Math.PI * 2, // for floating animation
      });
    });
  } else if (level === 'projects') {
    const projs = currentCtx?.platform
      ? DATA.projects.filter(p => p.platform === currentCtx.platform.id)
      : DATA.projects;
    projs.forEach((p, i) => {
      const r = Math.sqrt(p.threads / 109) * Math.min(W, H) * 0.22;
      const angle = (i / projs.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.25;
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: Math.max(r, 32), color: p.color, label: p.name,
        sub: p.threads + ' Threads', data: p, type: 'project',
        phase: Math.random() * Math.PI * 2,
      });
    });
  } else if (level === 'threads') {
    const proj = currentCtx?.project;
    const threads = proj?.threadList?.length > 0 ? proj.threadList : [
      {id:'g1',title:'Beispiel-Thread',platform:proj?.platform||'?',date:'2026-08-27',cats:['FEATURE'],user:'Input',agent:'Antwort',commit:null},
    ];
    threads.forEach((t, i) => {
      const angle = (i / threads.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.22;
      const catColor = t.cats?.includes('BUG') ? '#ef4444' : t.cats?.includes('FEATURE') ? '#10b981' : '#8b5cf6';
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: 35, color: catColor, label: t.title.substring(0, 20),
        sub: t.platform, data: t, type: 'thread',
        phase: Math.random() * Math.PI * 2,
      });
    });
  }

  // Animate from previous positions
  if (animate && prev.length > 0) {
    bubbles.forEach((b, i) => {
      if (i < prev.length) {
        b.x = prev[i].x;
        b.y = prev[i].y;
        b.r = prev[i].r;
      }
    });
    transitionProgress = 0;
    transitionFrom = prev.map(p => ({...p}));
    targetBubbles = bubbles.map(b => ({x: b.x, y: b.y, r: b.r}));
  }
}

function draw() {
  time += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Animate transition
  if (transitionProgress < 1) {
    transitionProgress = Math.min(1, transitionProgress + 0.04);
    const ease = 1 - Math.pow(1 - transitionProgress, 3); // easeOutCubic
    bubbles.forEach((b, i) => {
      if (i < targetBubbles.length && i < transitionFrom.length) {
        b.x = transitionFrom[i].x + (targetBubbles[i].x - transitionFrom[i].x) * ease;
        b.y = transitionFrom[i].y + (targetBubbles[i].y - transitionFrom[i].y) * ease;
        b.r = transitionFrom[i].r + (targetBubbles[i].r - transitionFrom[i].r) * ease;
      }
    });
  }

  // Floating animation
  bubbles.forEach(b => {
    b.x += Math.sin(time * 0.8 + b.phase) * 0.3;
    b.y += Math.cos(time * 0.6 + b.phase * 1.3) * 0.2;
  });

  // Draw connections
  ctx.lineWidth = 0.5;
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i], b = bubbles[j];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < 350) {
        const alpha = (1 - dist / 350) * 0.2;
        const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        gradient.addColorStop(0, a.color + Math.round(alpha * 255).toString(16).padStart(2,'0'));
        gradient.addColorStop(1, b.color + Math.round(alpha * 255).toString(16).padStart(2,'0'));
        ctx.strokeStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  // Draw bubbles
  bubbles.forEach(b => {
    const isH = hovered === b;
    const pulse = 1 + Math.sin(time * 2 + b.phase) * 0.02;
    const scale = isH ? 1.1 : pulse;
    const r = b.r * scale;

    // Outer glow (animated)
    const glowR = r * (1.4 + Math.sin(time * 1.5 + b.phase) * 0.1);
    const grad = ctx.createRadialGradient(b.x, b.y, r * 0.5, b.x, b.y, glowR);
    grad.addColorStop(0, b.color + '25');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Main circle
    ctx.fillStyle = b.color + (isH ? '35' : '20');
    ctx.strokeStyle = b.color + (isH ? 'dd' : '70');
    ctx.lineWidth = isH ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Inner ring pulse
    ctx.strokeStyle = b.color + '30';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r * (0.85 + Math.sin(time * 3 + b.phase) * 0.05), 0, Math.PI * 2);
    ctx.stroke();

    // Pie slice (for projects)
    if (b.type === 'project' && b.data.cats) {
      const cats = Object.entries(b.data.cats);
      const total = cats.reduce((s,[,v]) => s + v, 0);
      let ang = -Math.PI / 2;
      cats.forEach(([,count]) => {
        const sweep = (count / total) * Math.PI * 2;
        ctx.fillStyle = b.color + '35';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.arc(b.x, b.y, r * 0.65, ang, ang + sweep);
        ctx.closePath();
        ctx.fill();
        ang += sweep;
      });
    }

    // Labels
    ctx.fillStyle = '#fafafa';
    ctx.font = `${isH ? '600' : '500'} ${Math.max(10, r * 0.18)}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y - r * 0.08);

    ctx.fillStyle = '#71717a';
    ctx.font = `400 ${Math.max(8, r * 0.13)}px "JetBrains Mono", monospace`;
    ctx.fillText(b.sub, b.x, b.y + r * 0.15);

    // Click hint on hover
    if (isH && b.type !== 'thread') {
      ctx.fillStyle = b.color + 'aa';
      ctx.font = '500 9px Inter';
      ctx.fillText('Klicken zum Zoomen \u2192', b.x, b.y + r * 0.35);
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════
function loop() {
  updateParticles();
  drawParticles();
  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════════
const mainCanvas = document.getElementById('mainCanvas');
const tooltip = document.getElementById('tooltip');

mainCanvas.addEventListener('mousemove', e => {
  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hovered = null;
  for (const b of bubbles) {
    if (Math.hypot(mx - b.x, my - b.y) < b.r) { hovered = b; break; }
  }
  mainCanvas.style.cursor = hovered ? 'pointer' : 'default';
  if (hovered) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.innerHTML = `<div class="tt-title">${hovered.label}</div>
      <div class="tt-row"><span>Typ</span><span>${hovered.type}</span></div>
      <div class="tt-row"><span>Daten</span><span>${hovered.sub}</span></div>
      ${hovered.type !== 'thread' ? '<div style="margin-top:6px;color:var(--accent);font-size:10px">Klicken zum Zoomen</div>' : '<div style="margin-top:6px;color:var(--accent3);font-size:10px">Klicken fuer Details</div>'}`;
  } else {
    tooltip.style.display = 'none';
  }
});

mainCanvas.addEventListener('click', () => {
  if (!hovered) return;
  const b = hovered;
  history.push({level, ctx: currentCtx});

  if (b.type === 'platform') {
    level = 'projects';
    currentCtx = {platform: b.data};
  } else if (b.type === 'project') {
    level = 'threads';
    currentCtx = {...currentCtx, project: b.data};
  } else if (b.type === 'thread') {
    showDetail(b.data);
    history.pop(); // don't save thread click in history
    return;
  }

  updateBreadcrumb();
  updateSidePanel();
  layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
});

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  level = prev.level;
  currentCtx = prev.ctx;
  updateBreadcrumb();
  updateSidePanel();
  layoutBubbles(true);
  if (!history.length) document.getElementById('backBtn').classList.remove('visible');
}

// ═══════════════════════════════════════════════════════════════════════════
// BREADCRUMB
// ═══════════════════════════════════════════════════════════════════════════
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let h = `<div class="bc-item${level==='platforms'?' active':''}" onclick="navTo('platforms')">PRISM</div>`;
  if (currentCtx?.platform) {
    h += `<span class="bc-sep">&#9656;</span><div class="bc-item${level==='projects'?' active':''}" onclick="navTo('projects','${currentCtx.platform.id}')">${currentCtx.platform.name}</div>`;
  }
  if (currentCtx?.project) {
    h += `<span class="bc-sep">&#9656;</span><div class="bc-item active">${currentCtx.project.name}</div>`;
  }
  bc.innerHTML = h;
}

function navTo(lvl, pid) {
  history.push({level, ctx: currentCtx});
  if (lvl === 'platforms') { level = 'platforms'; currentCtx = null; }
  else if (lvl === 'projects') { level = 'projects'; currentCtx = {platform: DATA.platforms.find(p=>p.id===pid)}; }
  updateBreadcrumb(); updateSidePanel(); layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
}

// ═══════════════════════════════════════════════════════════════════════════
// SIDE PANEL
// ═══════════════════════════════════════════════════════════════════════════
function switchTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function updateSidePanel() {
  const s = document.getElementById('headerStats');
  if (level === 'platforms') {
    s.innerHTML = `<div class="stat blue"><div class="val">${DATA.stats.threads}</div><div class="lbl">Threads</div></div><div class="stat green"><div class="val">${DATA.stats.answered}</div><div class="lbl">Beantwortet</div></div><div class="stat red"><div class="val">${DATA.stats.open}</div><div class="lbl">Offen</div></div><div class="stat amber"><div class="val">${DATA.stats.interrupts}</div><div class="lbl">Interrupts</div></div><div class="stat purple"><div class="val">${DATA.stats.rate}%</div><div class="lbl">Rate</div></div>`;
  } else if (level === 'projects' && currentCtx?.platform) {
    const ps = DATA.projects.filter(p=>p.platform===currentCtx.platform.id);
    s.innerHTML = `<div class="stat blue"><div class="val">${ps.reduce((s,p)=>s+p.threads,0)}</div><div class="lbl">Threads</div></div><div class="stat green"><div class="val">${ps.length}</div><div class="lbl">Projekte</div></div>`;
  } else if (level === 'threads' && currentCtx?.project) {
    s.innerHTML = `<div class="stat blue"><div class="val">${currentCtx.project.threads}</div><div class="lbl">Threads</div></div>`;
  }
  updateOverview(); updateProjects(); updateThreads(); updateTimeline(); updateIntegrity();
}

function updateOverview() {
  const g = document.getElementById('overviewGrid');
  g.innerHTML = `<div class="ov-card"><div class="val" style="color:var(--accent)">${DATA.stats.threads}</div><div class="lbl">Gesamt</div></div><div class="ov-card"><div class="val" style="color:var(--accent2)">${DATA.stats.answered}</div><div class="lbl">Vollstaendig</div></div><div class="ov-card"><div class="val" style="color:var(--err)">${DATA.stats.open}</div><div class="lbl">Ohne Agent</div></div><div class="ov-card"><div class="val" style="color:var(--warn)">${DATA.stats.interrupts}</div><div class="lbl">Interrupts</div></div>`;
  const bar = document.getElementById('integrityBar');
  bar.innerHTML = `<div style="width:${(DATA.stats.answered/DATA.stats.threads*100).toFixed(1)}%;background:var(--accent2);border-radius:3px"></div><div style="width:${(DATA.stats.interrupts/DATA.stats.threads*100).toFixed(1)}%;background:var(--warn)"></div><div style="width:${(DATA.stats.open/DATA.stats.threads*100).toFixed(1)}%;background:var(--err)"></div>`;
  document.getElementById('platformList').innerHTML = DATA.platforms.map(p => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 8px;background:var(--bg3);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s" onmouseover="this.style.transform='translateX(4px)'" onmouseout="this.style.transform=''" onclick="navTo('projects','${p.id}')"><div style="width:8px;height:8px;border-radius:50%;background:${p.color}"></div><span style="font-size:12px;font-weight:500;flex:1">${p.name}</span><span style="font-size:11px;color:var(--text3)">${p.count}</span></div>`).join('');
}

function updateProjects() {
  const ps = currentCtx?.platform ? DATA.projects.filter(p=>p.platform===currentCtx.platform.id) : DATA.projects;
  document.getElementById('projectList').innerHTML = ps.map(p => {
    const top = Object.entries(p.cats||{}).sort((a,b)=>b[1]-a[1])[0];
    const maxThreads = Math.max(...DATA.projects.map(p=>p.threads));
    return `<div class="proj-card" onclick="clickProj('${p.name}')"><div class="proj-head"><span class="proj-name">${p.name}</span><span class="proj-pct" style="color:${p.color}">${p.threads}</span></div><div class="proj-bar"><div class="proj-bar-fill" style="width:${p.threads/maxThreads*100}%;background:${p.color}"></div></div><div class="proj-meta">${(p.platforms||[]).map(pl=>`<span class="proj-tag">${pl}</span>`).join('')}<span class="proj-tag">${top?top[0]:'N/A'}</span></div></div>`;
  }).join('');
}

function updateThreads() {
  let ts = [];
  if (currentCtx?.project) ts = currentCtx.project.threadList;
  else if (currentCtx?.platform) DATA.projects.filter(p=>p.platform===currentCtx.platform.id).forEach(p=>ts.push(...p.threadList));
  else DATA.projects.forEach(p=>ts.push(...p.threadList));
  document.getElementById('threadList').innerHTML = ts.map(t => {
    const plat = DATA.platforms.find(p=>p.id===t.platform);
    return `<div class="thread-card" onclick="clickThread('${t.id}')"><div class="thread-head"><span class="thread-title">${t.title}</span><span class="thread-platform" style="background:${plat?.color||'var(--bg3)'}22;color:${plat?.color||'var(--text3)'}">${t.platform}</span></div><div class="thread-meta"><span class="thread-tag">${t.cats?.join(', ')||''}</span><span>${t.date}</span>${t.commit?'<span class="commit-badge">\u2713 '+t.commit+'</span>':''}</div><div class="thread-snippet">${t.user}</div></div>`;
  }).join('');
}

function updateTimeline() {
  document.getElementById('timelineList').innerHTML = DATA.timeline.map(d => `<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px">${d.date} <span style="background:var(--bg3);border-radius:12px;padding:2px 10px;font-size:10px;color:var(--text2)">${d.commits.length} Commits</span></div>${d.commits.map(c=>`<div style="display:flex;gap:8px;padding:4px 0 4px 16px;border-left:2px solid var(--border)"><span class="mono" style="color:var(--accent2);font-size:11px">${c.hash}</span><span style="font-size:12px;color:var(--text2)">${c.msg}</span></div>`).join('')}</div>`).join('');
}

function updateIntegrity() {
  document.getElementById('integrityIssues').innerHTML = `<div style="margin-bottom:12px;font-size:11px;font-weight:600;color:var(--err)">${DATA.noAgent.length} Threads ohne Agent-Antwort</div>${DATA.noAgent.map(t=>`<div style="background:var(--bg3);border-left:3px solid var(--err);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 12px;margin-bottom:6px"><div style="font-size:12px;font-weight:500">${t.title}</div><div style="font-size:10px;color:var(--text3);margin-top:4px">${t.platform} \u00b7 ${t.date}</div><div style="font-size:11px;color:var(--text2);margin-top:4px">Input: "${t.user}"</div></div>`).join('')}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════════════════════════════════
function showDetail(t) {
  document.getElementById('detailTitle').textContent = t.title;
  document.getElementById('detailContent').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><span style="background:var(--bg3);border-radius:4px;padding:2px 8px;font-size:10px;color:var(--accent3)">${t.platform}</span><span style="font-size:11px;color:var(--text3)">${t.date}</span>${(t.cats||[]).map(c=>`<span style="background:var(--bg3);border-radius:4px;padding:2px 8px;font-size:10px;color:var(--accent)">${c}</span>`).join('')}${t.commit?`<span class="commit-badge">\u2713 ${t.commit}</span>`:''}</div><div class="msg-card"><div class="msg-role user">User Input</div><div class="msg-content">${t.user}</div></div><div class="msg-card"><div class="msg-role assistant">Agent Antwort</div><div class="msg-content">${t.agent}</div></div>`;
  document.getElementById('detailPanel').classList.add('visible');
}

function closeDetail() { document.getElementById('detailPanel').classList.remove('visible'); }

function clickProj(name) {
  const p = DATA.projects.find(x=>x.name===name);
  if (!p) return;
  history.push({level, ctx: currentCtx});
  level = 'threads'; currentCtx = {...currentCtx, project: p};
  updateBreadcrumb(); updateSidePanel(); layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
}

function clickThread(id) {
  for (const p of DATA.projects) {
    const t = p.threadList.find(x=>x.id===id);
    if (t) { showDetail(t); return; }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function resize() {
  const rect = document.querySelector('.canvas-area').getBoundingClientRect();
  W = rect.width; H = rect.height;
  const dpr = window.devicePixelRatio || 1;
  [document.getElementById('bgCanvas'), mainCanvas].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  bgCtx = document.getElementById('bgCanvas').getContext('2d');
  ctx = mainCanvas.getContext('2d');
  bgCtx.scale(dpr, dpr);
  ctx.scale(dpr, dpr);
  initParticles();
  layoutBubbles();
}

window.addEventListener('resize', resize);
resize();
updateBreadcrumb();
updateSidePanel();
loop();
</script>
</body>
</html>
