<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
    <linearGradient id="lightIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="16%" style="stop-color:#f97316"/>
      <stop offset="33%" style="stop-color:#eab308"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="66%" style="stop-color:#3b82f6"/>
      <stop offset="83%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
  </g>

  <!-- Light beam entering prism -->
  <path d="M 40,160 L 280,150" stroke="url(#lightIn)" stroke-width="4" fill="none" filter="url(#glow)" opacity="0.8"/>
  <path d="M 40,165 L 280,155" stroke="url(#lightIn)" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Prism (triangle) -->
  <polygon points="300,80 380,180 220,180" fill="none" stroke="#52525b" stroke-width="1.5" opacity="0.7"/>
  <polygon points="300,80 380,180 220,180" fill="#ffffff" opacity="0.04"/>
  <polygon points="300,80 380,180 220,180" fill="none" stroke="#71717a" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  
  <!-- Refracted spectrum beams -->
  <g filter="url(#softGlow)">
    <path d="M 310,140 C 420,125 550,90 1150,65" stroke="#ef4444" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 315,145 C 420,135 550,110 1150,95" stroke="#f97316" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 320,150 C 420,145 550,130 1150,125" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 325,155 C 420,155 550,150 1150,155" stroke="#22c55e" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 330,160 C 420,165 550,170 1150,185" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M 335,165 C 420,175 550,190 1150,215" stroke="#8b5cf6" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Spectrum glow bar -->
  <rect x="400" y="55" width="750" height="180" rx="4" fill="url(#spectrum)" opacity="0.02"/>

  <!-- PRISM Title with acronym letters -->
  <text x="420" y="120" font-family="Inter, -apple-system, sans-serif" font-size="56" font-weight="700" letter-spacing="-2">
    <tspan fill="#ef4444" filter="url(#textGlow)">P</tspan><tspan fill="#f97316">R</tspan><tspan fill="#eab308">I</tspan><tspan fill="#22c55e">S</tspan><tspan fill="#3b82f6">M</tspan>
  </text>
  
  <!-- Acronym expansion -->
  <text x="422" y="145" font-family="Inter, -apple-system, sans-serif" font-size="13" fill="#71717a" letter-spacing="3" font-weight="500">
    <tspan fill="#ef4444">P</tspan>latform 
    <tspan fill="#f97316">R</tspan>ecognition &amp; 
    <tspan fill="#eab308">I</tspan>nput 
    <tspan fill="#22c55e">S</tspan>ession 
    <tspan fill="#3b82f6">M</tspan>iner
  </text>
  
  <!-- Tagline -->
  <text x="422" y="175" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#52525b" font-weight="400">
    <tspan x="422" dy="0">Die hastigen Eingaben von 15 AI-Coding-Agenten</tspan>
    <tspan x="422" dy="18">in ein kohaerentes Dashboard verwandelt.</tspan>
    <tspan x="422" dy="18">Weil ein Screenshotscreen niemanden begeistert.</tspan>
  </text>
  
  <!-- Stats -->
  <g transform="translate(800, 200)">
    <text x="0" y="0" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#3b82f6">341</text>
    <text x="65" y="0" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Threads</text>
    
    <text x="0" y="30" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#10b981">12</text>
    <text x="65" y="30" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Plattformen</text>
    
    <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="28" font-weight="700" fill="#8b5cf6">29K+</text>
    <text x="65" y="60" font-family="Inter, sans-serif" font-size="11" fill="#71717a">Messages</text>
  </g>

  <!-- Version badge -->
  <rect x="1080" y="40" width="80" height="24" rx="12" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="1120" y="56" font-family="JetBrains Mono, monospace" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="500">v6.0.0</text>
</svg>