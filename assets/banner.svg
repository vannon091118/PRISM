<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#09090b"/>
      <stop offset="100%" style="stop-color:#18181b"/>
    </linearGradient>
    <linearGradient id="lightIn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.9"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="16%" style="stop-color:#f97316"/>
      <stop offset="33%" style="stop-color:#eab308"/>
      <stop offset="50%" style="stop-color:#22c55e"/>
      <stop offset="66%" style="stop-color:#3b82f6"/>
      <stop offset="83%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="280" fill="url(#prismGrad)"/>
  
  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- Light beam entering -->
  <path d="M 50,140 L 320,130" stroke="url(#lightIn)" stroke-width="4" fill="none" filter="url(#glow)" opacity="0.8"/>
  <path d="M 50,145 L 320,135" stroke="url(#lightIn)" stroke-width="1.5" fill="none" opacity="0.4"/>
  
  <!-- Prism (triangle) -->
  <polygon points="330,80 400,170 260,170" fill="none" stroke="#3f3f46" stroke-width="1.5" opacity="0.6"/>
  <polygon points="330,80 400,170 260,170" fill="#ffffff" opacity="0.03"/>
  <polygon points="330,80 400,170 260,170" fill="none" stroke="#52525b" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.3"/>
  
  <!-- Refracted spectrum beams -->
  <g filter="url(#softGlow)">
    <path d="M 340,135 C 400,130 500,100 850,80" stroke="#ef4444" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 345,140 C 400,138 500,118 850,108" stroke="#f97316" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 350,145 C 400,145 500,135 850,135" stroke="#eab308" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 355,150 C 400,152 500,152 850,162" stroke="#22c55e" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 360,155 C 400,158 500,168 850,190" stroke="#3b82f6" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 365,160 C 400,165 500,185 850,218" stroke="#8b5cf6" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  
  <!-- Spectrum glow bar -->
  <rect x="420" y="70" width="430" height="170" rx="4" fill="url(#spectrum)" opacity="0.03"/>

  <!-- Title -->
  <text x="330" y="55" font-family="Inter, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#fafafa" letter-spacing="-1">
    <tspan fill="#3b82f6">&#x25C8;</tspan> PRISM
  </text>
  
  <!-- Subtitle -->
  <text x="330" y="75" font-family="Inter, -apple-system, sans-serif" font-size="11" fill="#71717a" letter-spacing="2" font-weight="400">
    PLATFORM RECOGNITION &amp; INPUT SESSION MINER
  </text>
  
  <!-- Tagline -->
  <text x="48" y="200" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#52525b" font-weight="400">
    <tspan x="48" dy="0">Die hastigen Eingaben von 15 AI-Coding-Agenten</tspan>
    <tspan x="48" dy="18">in ein kohaerentes Dashboard verwandelt.</tspan>
    <tspan x="48" dy="18">Weil ein Spreadsheetscreen niemanden begeistert.</tspan>
  </text>
  
  <!-- Stats -->
  <text x="600" y="200" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#3b82f6">341</text>
  <text x="660" y="200" font-family="Inter, sans-serif" font-size="10" fill="#71717a">Threads</text>
  
  <text x="600" y="225" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#10b981">12</text>
  <text x="660" y="225" font-family="Inter, sans-serif" font-size="10" fill="#71717a">Plattformen</text>
  
  <text x="600" y="250" font-family="JetBrains Mono, monospace" font-size="24" font-weight="700" fill="#8b5cf6">29K+</text>
  <text x="660" y="250" font-family="Inter, sans-serif" font-size="10" fill="#71717a">Messages</text>

  <!-- Version badge -->
  <rect x="780" y="40" width="80" height="24" rx="12" fill="#3b82f6" opacity="0.1" stroke="#3b82f6" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="820" y="56" font-family="JetBrains Mono, monospace" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="500">v6.0.0</text>
</svg>