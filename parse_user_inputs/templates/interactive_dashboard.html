<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PRISM — Animiertes Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b; --bg2: #18181b; --bg3: #27272a;
  --border: #3f3f46; --text: #fafafa; --text2: #a1a1aa; --text3: #71717a;
  --accent: #3b82f6; --accent2: #10b981; --accent3: #8b5cf6;
  --warn: #f59e0b; --err: #ef4444;
  --radius: 10px; --radius-sm: 6px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.5;
  height: 100vh; overflow: hidden; display: flex; flex-direction: column;
}

/* ── Header ────────────────────────────────────────────────────────────── */
.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.header h1 {
  font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  display: flex; align-items: center; gap: 8px;
}
.header .meta { color: var(--text3); font-size: 11px; }
.header .stats { display: flex; gap: 4px; }
.header .stat {
  text-align: center; padding: 4px 10px;
  border-radius: var(--radius-sm); background: var(--bg3); min-width: 60px;
}
.header .stat .val { font-size: 16px; font-weight: 700; }
.header .stat .lbl { font-size: 8px; text-transform: uppercase; color: var(--text3); }
.header .stat.green .val { color: var(--accent2); }
.header .stat.red .val { color: var(--err); }
.header .stat.amber .val { color: var(--warn); }
.header .stat.purple .val { color: var(--accent3); }
.header .stat.blue .val { color: var(--accent); }

/* ── Main ──────────────────────────────────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; }

/* ── Canvas ────────────────────────────────────────────────────────────── */
.canvas-area { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
#bgCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }

/* ── Breadcrumb ────────────────────────────────────────────────────────── */
.breadcrumb {
  position: absolute; top: 12px; left: 12px; z-index: 50;
  display: flex; gap: 4px; align-items: center;
}
.bc-item {
  background: rgba(9,9,11,0.9); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 5px 10px; font-size: 11px;
  color: var(--text3); cursor: pointer; transition: all 0.2s;
  font-weight: 500; backdrop-filter: blur(8px);
}
.bc-item:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
.bc-item.active { color: var(--accent); border-color: var(--accent); }
.bc-sep { color: var(--text3); font-size: 10px; }

/* ── Back Button ───────────────────────────────────────────────────────── */
.back-btn {
  position: absolute; top: 12px; left: 12px; z-index: 50;
  background: rgba(9,9,11,0.9); border: 1px solid var(--accent);
  border-radius: var(--radius-sm); padding: 5px 12px; font-size: 11px;
  color: var(--accent); cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: none; font-weight: 500;
  backdrop-filter: blur(8px);
}
.back-btn:hover { background: var(--accent); color: var(--bg); transform: translateX(-2px); }
.back-btn.visible { display: flex; align-items: center; gap: 6px; }

/* ── Legend ─────────────────────────────────────────────────────────────── */
.canvas-overlay {
  position: absolute; bottom: 12px; left: 12px; right: 12px;
  display: flex; gap: 6px; pointer-events: none;
}
.canvas-legend {
  background: rgba(9,9,11,0.92); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 10px; font-size: 10px;
  display: flex; gap: 10px; align-items: center; pointer-events: auto;
  backdrop-filter: blur(8px);
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── Side Panel ────────────────────────────────────────────────────────── */
.side-panel {
  width: 400px; background: var(--bg2); border-left: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
.tab-bar { display: flex; border-bottom: 1px solid var(--border); padding: 0 4px; }
.tab-btn {
  flex: 1; padding: 10px 6px; background: transparent; border: none;
  color: var(--text3); font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; font-family: inherit;
  border-bottom: 2px solid transparent;
}
.tab-btn:hover { color: var(--text2); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-content {
  flex: 1; overflow-y: auto; padding: 16px;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
}
.tab-content::-webkit-scrollbar { width: 4px; }
.tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.tab-pane { display: none; animation: fadeIn 0.3s ease; }
.tab-pane.active { display: block; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── Cards ─────────────────────────────────────────────────────────────── */
.section-title {
  font-size: 11px; font-weight: 600; color: var(--text3);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}
.overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
.ov-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; text-align: center;
  transition: all 0.2s;
}
.ov-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.ov-card .val { font-size: 22px; font-weight: 700; }
.ov-card .lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-top: 2px; }

.integrity-bar {
  height: 6px; border-radius: 3px; overflow: hidden;
  display: flex; margin-bottom: 16px; background: var(--bg3);
}

.proj-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 6px;
  cursor: pointer; transition: all 0.2s;
}
.proj-card:hover { border-color: var(--accent); transform: translateX(4px); }
.proj-card .proj-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.proj-card .proj-name { font-size: 13px; font-weight: 600; }
.proj-card .proj-pct { font-size: 13px; font-weight: 700; }
.proj-card .proj-bar { height: 3px; border-radius: 2px; background: var(--bg); overflow: hidden; margin-bottom: 8px; }
.proj-card .proj-bar-fill { height: 100%; border-radius: 2px; transition: width 0.8s ease; }
.proj-card .proj-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text3); flex-wrap: wrap; }
.proj-card .proj-tag { background: var(--bg); border-radius: 3px; padding: 1px 5px; border: 1px solid var(--border); }

.thread-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 12px; margin-bottom: 6px;
  cursor: pointer; transition: all 0.2s;
}
.thread-card:hover { border-color: var(--accent); transform: translateX(4px); }
.thread-card .thread-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.thread-card .thread-title { font-size: 12px; font-weight: 500; flex: 1; }
.thread-card .thread-platform {
  font-size: 9px; padding: 2px 6px; border-radius: 3px;
  text-transform: uppercase; font-weight: 600; flex-shrink: 0;
}
.thread-card .thread-meta { display: flex; gap: 6px; font-size: 10px; color: var(--text3); }
.thread-card .thread-tag { background: var(--bg); border-radius: 3px; padding: 1px 5px; border: 1px solid var(--border); }
.thread-card .thread-snippet { font-size: 11px; color: var(--text2); margin-top: 6px; max-height: 40px; overflow: hidden; }

.msg-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 6px;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
.msg-card .msg-role { font-size: 9px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 4px; }
.msg-card .msg-role.user { color: var(--accent); }
.msg-card .msg-role.assistant { color: var(--accent3); }
.msg-card .msg-content { font-size: 12px; color: var(--text2); white-space: pre-wrap; word-break: break-word; max-height: 120px; overflow: hidden; line-height: 1.5; }

.commit-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 9px; padding: 1px 6px; border-radius: 3px;
  font-weight: 600; background: rgba(16,185,129,0.1); color: var(--accent2);
  border: 1px solid rgba(16,185,129,0.2);
}

/* ── Tooltip ───────────────────────────────────────────────────────────── */
#tooltip {
  display: none; position: fixed; background: var(--bg2);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; font-size: 11px; pointer-events: none;
  z-index: 100; max-width: 320px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(12px);
  animation: tooltipIn 0.15s ease;
}
@keyframes tooltipIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
#tooltip .tt-title { font-weight: 600; margin-bottom: 6px; font-size: 12px; }
#tooltip .tt-row { display: flex; justify-content: space-between; color: var(--text3); padding: 1px 0; }

/* ── Detail Panel ──────────────────────────────────────────────────────── */
.detail-panel {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--bg2); border-top: 1px solid var(--border);
  padding: 16px; max-height: 50%; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  z-index: 60;
}
.detail-panel.visible { transform: translateY(0); }
.detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.detail-title { font-size: 14px; font-weight: 600; }
.detail-close {
  background: transparent; border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px 8px; color: var(--text3);
  cursor: pointer; font-size: 11px; transition: all 0.2s;
}
.detail-close:hover { border-color: var(--err); color: var(--err); }
</style>
</head>

r auf dem PATH noch in \`$LOCALAPPDATA/Programs\`; per \`export GODOT_BIN=\"…\"\` setzen. - \`--headless --path . --quit-after 2\` = Main-Scene-Smoke-Test; \`--headless --path . --script res://scripts/preflight.gd\` = persistente Testsuite (kein externes GUT). Temporäre Lifecycle-Checks nutzen \`res://.tmp_*.gd\` und müssen nach Abschluss restlos entfernt werden (inklusive generiertem \`.tmp_*.gd.uid\`-Sidecar). - Preflight gibt am Ende \`ERROR: …RID allocations… leaked at exit\` / \`ObjectDB instances leaked\` aus — das ist normales Teardown-Rauschen des Dummy-Renderers im Headless-Modus. Verbindlich ist die Zeile \`RESULT: PASSED\`. - Der Headless-Modus nutzt den Dummy-Renderer, daher ist \`Window.get_texture()\` null; visuelle Screenshots/Captures benötigen den Desktop Compatibility/OpenGL-Renderer, und \`Window.size\` muss nach Szenen-Initialisierung explizit gesetzt werden. - Ein Headless-Editor-Scan kann mit Exit-Code 0 enden, selbst wenn ein \`EditorFileServer\` Port-6010-Konflikt den Scan-Thread abbricht. Verlässlicher Maßstab sind Preflight + Smoke-Test. Render-Budget-Assertions schätzen CanvasItem-Submissions, nicht GPU-Framezeiten.  ## Preflight-Suite Architektur & Verträge - **Preflight ist modular aufgebaut:** \`scripts/preflight.gd\` ist der Orchestrator. Er instanziiert einen \`PreflightContext\` sowie eine \`PreflightFixture\` und führt die Module aus \`CONSTRAINT_REGISTRY\` aus. - **Registrierung:** Neue Constraints werden als eigene \`PreflightConstraintX\`-Klasse mit \`constraint_name() -> String\` und \`run(ctx: PreflightContext) -> bool\` implementiert und in \`CONSTRAINT_REGISTRY\` in \`scripts/preflight.gd\` registriert (\`{\"id\": \"...\", \"script\": preload(\"...\"), \"desc\": \"...\", \"requires_scene\": bool}\`). - **Fixture-Isolation:** Szenenabhängige Constraints (\`requires_scene: true\`) erhalten über \`ctx.fixture.boot_default(ctx)\` eine isolierte Szenen-Fixture. Jeder Boot räumt die vorherige Szene auf und setzt \`GameState\` aus d hält einen eigenständigen, READ-Only Scenario-Loader der Spielzustände aus \`.tres\`-Snapshots auf GameState anwendet, ohne die Snapshot-Ressource zu verändern. \`MechanicRegistry\` entdeckt alle Spielmechaniken via Reflection (\`GameState.get_signal_list()\`), \`ScenarioSnapshot\` kapselt Metadaten + Coverage, \`ScenarioLoader\` lädt und wendet an. Preflight-Constraint \`mechanic_coverage\` validiert automatisch: entdeckte Mechaniken haben Beschreibung + Domäne, Test-Modelle existieren, Scenario-Files sind valide. Neue Mechaniken werden automatisch erkannt und gemeldet. Doku: \`scripts/testing/SCENARIO_LOADER_SPEC.md\`.  ## Architektur & System-Verträge - **Szenen-Architektur (3 Spiele, 1 SSO):** Das Spiel ist in vier bootbare Szenen getrennt, die sich GameState als SSO teilen und über den \`SceneDirectorService\`-Autoload wechseln:   - \`scenes/main_menu/main_menu.tscn\` (Einstieg; \`run/main_scene\`): Neues Spiel / Weiter / Beenden.   - \`scenes/world/world.tscn\` (Layer 1, Strategie-Overworld): \`WorldBootstrap\`-Wurzel + \`Background\`-Renderer + \`PlanetField\` + \`MeteorField\` + \`MapCamera\` + \`PauseMenu\`.   - \`scenes/battle/battle_scene.tscn\` (Layer 2, Flotten-Replay).   - \`scenes/conquest/conquest_scene.tscn\` (Layer 3, Eroberungs-Replay).   - \`SceneDirectorService\` führt Szenen-Wechsel über den dokumentierten Custom-Switcher aus (deferred free + add_child + \`current_scene\`), nicht \`change_scene_to_packed\`. \`GameCycleManager\` entscheidet WANN gewechselt wird, der Director WIE. Kontext wandert ausschließlich über GameState (\`pending_battle_context\` / \`request_world_reconnect\` / \`RunSession\`). - **Geteilte WorldConfig:** \`WorldBootstrap._enter_tree()\` (Wurzel von \`world.tscn\`) wählt das Szenario, finalisiert \`layout_seed\` (\`_finalize_layout_seed\`) und generiert \`active_catalog\`, bevor \`GameState\`, \`PlanetField\` und \`MeteorField\` initialisiert werden. \`Bootstrap._ready()\` dealt die Ressourcen mit diesem finalisierten Seed. Der \`Background\`-Renderer (\`starfield_background.gd\`) ist reine Optik und berührt weder GameState noch Katalog oder Szenario. - **Save/Load (Godot-Resource):** \`SaveGameService\` (Autoload) schreibt \`RunSaveData\`-Snapshots nach \`user://saves/run_<slot>.tres\` (atomar via \`_tmp.tres\` + Rename). \`GameState.snapshot_run()\`/\`restore_run()\` erfassen/restaurieren alle vier Domains, Transits, Chunk-Daten und Timer. \`load_run()\` setzt \`_reconnect_requested\`, die World bootet danach über \`reconnect_world()\` mit der gespeicherten Session; \`SeededLayout\` lädt den Chunk-Payload vor der Instanziierung. Auto-Save bei \`NOTIFICATION_WM_CLOSE_REQUEST\` — nie im Headless-Modus (\`OS.has_feature(\"headless\")\`-Guard), sonst schreibt die Preflight-Suite/der pre-commit-Hook Testzustand über echte Spielstände. - **Slot-Konvention:** Das Spiel nutzt ausschließlich Slot 0 (PauseMenu-Save, MainMenu-Continue, Auto-Save). Die Preflight-Suite darf Slot 0 nie zerstören: \`constraint_main_menu_and_flow\` sichert/restauriert den echten Save via Backup (backup/restore-Vertrag, empirisch verifiziert), \`constraint_save_game_roundtrip\` nutzt Test-Slot 7, \`constraint_save_game_slots\` die Slots 1–2. Neue Save-Tests müssen sich an diese Konvention halten (Slots 1–7 = Test-Slots, Slot 0 = echter Spielstand). - **Single-Source Weltgenerierung:** \`WorldGenerator.generate_catalog(config, active_layout_seed, target_planet_count)\` erzeugt den Sektor-Katalog genau einmal (\`p0\`/\`p1\` = Homeworlds von Spieler \`a\` und CPU \`b\`, \`p2\`..\`p9\` = neutrale Welten aus Baustein-Texturen). \`SeededLayout\` darf den Katalog nicht neu generieren. - **Homeworld-Separation:** \`SeededLayout._separate_homeworlds()\` hält die beiden Homeworlds nicht-benachbart, sodass jede mindestens 2 neutrale Nachbarn für Scouts und Expansion besitzt. - **Raster- & Nachbarschaftsauflösung:** Adjazenz und Dimensionen werden ausschließlich über \`WorldConfig.resolved_columns()\`, \`resolved_size_class_counts()\`, \`resolved_design_size()\` und \`resolved_target_planet_count()\` bezogen — niemals über rohes \`columns\`. - **Planeten-Lebenszyklus & Detail-Profile:** \`Planet.layout_size\` leitet sich aus \`Planet.size_profile\` ab. Bauplätze sind profilgesteuert (variable=1, large=2, XL=3). Worker-Spawn-Timer existieren, bleiben aber gestoppt bis \`worker_automation\` erforscht und eine Worker-Fabrik errichtet wurde. - **SectorSystem (opt-in Dichte-Feld):** Neue Typen tragen bewusst das Präfix \`Sector*\` (Namenskollision mit dem Worker-Transit-System \`WorkerCluster\`/\`ClusterTierDefinition\`). Aktiv nur bei \`WorldConfig.sector_count > 0\` (\`resolved_sector_count()\`); \`SectorClassifier\` ist ein statischer \`RefCounted\` und wird von \`SeededLayout\` (endlicher Pfad) und \`ChunkCoordinator\` (unendlicher Pfad) aufgerufen. - **Sector-Größenwirkung ist rein visuell:** Skalierung ausschließlich über \`planet_visual_scale\`/\`resolved_planet_visual_scale()\` (0.6 im Shipped-Szenario) in beiden Pfaden — niemals \`set_size_profile\`, sonst bricht Worker-/Gameplay-Determinismus. Klassifikation landet als \`set_meta\` (\`sector_id\`/\`sector_role\`/\`sector_depth\`) auf den Planeten. - **Planet-Modul-Architektur:** \`planet.gd\` ist der zentrale Knotenpunkt und delegiert spezialisierte Aufgaben:   - \`PlanetArrivalResolver\` (\`scripts/objects/planets/planet_arrival_resolver.gd\`): Deterministische Arrival-, Missions- und Konfliktauflösung.   - \`PlanetTraitAggregator\` (\`scripts/objects/planets/planet_trait_aggregator.gd\`): Aggregation von Upgrade- und Trait-Boni.   - \`PlanetView\` (\`scripts/objects/planets/view/planet_view.gd\`): Reine CanvasItem-Zeichenroutinen (Faction-Ringe, StrengthLabels).   - \`PlanetProcedural\` (\`scripts/objects/planets/procedural/planet_procedural.gd\`): Komposition prozeduraler Planeten.   - \`ContextMenuBuilder\` (\`scripts/objects/planets/context_menu_builder.gd\`): Konstruktion und Gating des Rechtsklick-Kontextmenüs. - **GameState als Domain-Fassade:** \`GameState\` (/root/GameState) ist der zentrale SSOT für Besitz, Ressourcen, Forschung und Schiffe und delegiert an 4 Sub-Domänen (\`scripts/state/domains/\`):   - \`FactionDomain\`: Besitzverhältnisse, Homeworlds, Discovery, Scan-Intel, Starter-Scout.   - \`EconomyDomain\`: Faction-Vaults, Ressourcen-Deals, Upgrades, Worker-Factories, persistente Gatherer.   - \`TechDomain\`: Globale & planetare Technologien, Forschungs-Jobs, Voraussetzungen.   - \`ShipDomain\`: Teile-Inventare, Schiffsmontage (\`assemble_ship\`), Zerlegung, Bau-Jobs, FleetSnapshots. - **Ressourcen & Overdraft-Schutz:** Ressourcen sind unsichtbare \`GameResource\`-Datenobjekte aus dem \`ResourcePool\`. \`spend_faction_resource()\` blockiert bei unzureichendem Guthaben vollständig (kein Overdraft, keine Teilzahlung). - **Wirtschaft & Sammeltrupps:** Der Economy-Timer (10s) läuft erst nach \`worker_automation\`. Ein separater Gather-Timer (10s) läuft dauerhaft: \`collect\`-Missionen registrieren persistente Gatherer in \`GameState._gathering_workers\`, die pro Tick \`workers × resource_base\` einbringen. - **Navigation & Routing:** Pro Nachbarschaftskante existiert ein Moon-/Comet-Waypoint, überlagert von einem K-Nearest-Langstreckengraph (\`NavigationField\`). \`NavigationField.find_route()\` liefert den Pfad für Flugvorschau und Transit. - **Flugzeit & Cluster-Packing:** \`FlightTime.seconds_for()\` berechnet die Dauer basierend auf Distanz, Einheitenlast und Quell-Transfer-Speed. Worker-Transit packt nach Largest-First (K=1, M=5, L=100); alle Gruppen starten im selben Frame. - **UI-Stack:**   - \`PlanetNetworkUI\` (CanvasLayer 50): Komponiert \`VaultBar\` (\`scenes/ui/vault_bar.tscn\`) und \`PlanetPanel\` (\`scenes/ui/planet_panel.tscn\`).   - \`TechnologyMenu\` (CanvasLayer 60): Unterteilt in \`TechResearchView\`, \`TechScoutView\`, \`TechShipBuilderView\` und \`TechPlanetView\`. Schließt das PlanetPanel bei Öffnung.   - \`DossierLauncher\` (CanvasLayer 40): Drei Buttons (P anicRegistry\` entdeckt alle Spielmechaniken via Reflection (\`GameState.get_signal_list()\`), \`ScenarioSnapshot\` kapselt Metadaten + Coverage, \`ScenarioLoader\` lädt und wendet an. Preflight-Constraint \`mechanic_coverage\` validiert automatisch: entdeckte Mechaniken haben Beschreibung + Domäne, Test-Modelle existieren, Scenario-Files sind valide. Neue Mechaniken werden automatisch erkannt und gemeldet. Doku: \`scripts/testing/SCENARIO_LOADER_SPEC.md\`.  ## Architektur & System-Verträge - **Szenen-Architektur (3 Spiele, 1 SSO):** Das Spiel ist in vier bootbare Szenen getrennt, die sich GameState als SSO teilen und über den \`SceneDirectorService\`-Autoload wechseln:   - \`scenes/main_menu/main_menu.tscn\` (Einstieg; \`run/main_scene\`): Neues Spiel / Weiter / Beenden.   - \`scenes/world/world.tscn\` (Layer 1, Strategie-Overworld): \`WorldBootstrap\`-Wurzel + \`Background\`-Renderer + \`PlanetField\` + \`MeteorField\` + \`MapCamera\` + \`PauseMenu\`.   - \`scenes/battle/battle_scene.tscn\` (Layer 2, Flotten-Replay).   - \`scenes/conquest/conquest_scene.tscn\` (Layer 3, Eroberungs-Replay).   - \`SceneDirectorService\` führt Szenen-Wechsel über den dokumentierten Custom-Switcher aus (deferred free + add_child + \`current_scene\`), nicht \`change_scene_to_packed\`. \`GameCycleManager\` entscheidet WANN gewechselt wird, der Director WIE. Kontext wandert ausschließlich über GameState (\`pending_battle_context\` / \`request_world_reconnect\` / \`RunSession\`). - **Geteilte WorldConfig:** \`WorldBootstrap._enter_tree()\` (Wurzel von \`world.tscn\`) wählt das Szenario, finalisiert \`layout_seed\` (\`_finalize_layout_seed\`) und generiert \`active_catalog\`, bevor \`GameState\`, \`PlanetField\` und \`MeteorField\` initialisiert werden. \`Bootstrap._ready()\` dealt die Ressourcen mit diesem finalisierten Seed. Der \`Background\`-Renderer (\`starfield_background.gd\`) ist reine Optik und berührt weder GameState noch Katalog oder Szenario. - **Save/Load (Godot-Resource):** \`SaveGameService\` (Autoload) schreibt \`RunSaveData\`-Snapshots nach \`user://saves/run_<slot>.tres\` (atomar via \`_tmp.tres\` + Rename). \`GameState.snapshot_run()\`/\`restore_run()\` erfassen/restaurieren alle vier Domains, Transits, Chunk-Daten und Timer. \`load_run()\` setzt \`_reconnect_requested\`, die World bootet danach über \`reconnect_world()\` mit der gespeicherten Session; \`SeededLayout\` lädt den Chunk-Payload vor der Instanziierung. Auto-Save bei \`NOTIFICATION_WM_CLOSE_REQUEST\` — nie im Headless-Modus (\`OS.has_feature(\"headless\")\`-Guard), sonst schreibt die Preflight-Suite/der pre-commit-Hook Testzustand über echte Spielstände. - **Slot-Konvention:** Das Spiel nutzt ausschließlich Slot 0 (PauseMenu-Save, MainMenu-Continue, Auto-Save). Die Preflight-Suite darf Slot 0 nie zerstören: \`constraint_main_menu_and_flow\` sichert/restauriert den echten Save via Backup (backup/restore-Vertrag, empirisch verifiziert), \`constraint_save_game_roundtrip\` nutzt Test-Slot 7, \`constraint_save_game_slots\` die Slots 1–2. Neue Save-Tests müssen sich an diese Konvention halten (Slots 1–7 = Test-Slots, Slot 0 = echter Spielstand). - **Single-Source Weltgenerierung:** \`WorldGenerator.generate_catalog(config, active_layout_seed, target_planet_count)\` erzeugt den Sektor-Katalog genau einmal (\`p0\`/\`p1\` = Homeworlds von Spieler \`a\` und CPU \`b\`, \`p2\`..\`p9\` = neutrale Welten aus Baustein-Texturen). \`SeededLayout\` darf den Katalog nicht neu generieren. - **Homeworld-Separation:** \`SeededLayout._separate_homeworlds()\` hält die beiden Homeworlds nicht-benachbart, sodass jede mindestens 2 neutrale Nachbarn für Scouts und Expansion besitzt. - **Raster- & Nachbarschaftsauflösung:** Adjazenz und Dimensionen werden ausschließlich über \`WorldConfig.resolved_columns()\`, \`resolved_size_class_counts()\`, \`resolved_design_size()\` und \`resolved_target_planet_count()\` bezogen — niemals über rohes \`columns\`. - **Planeten-Lebenszyklus & Detail-Profile:** \`Planet.layout_size\` leitet sich aus \`Planet.size_profile\` ab. Bauplätze sind profilgesteuert (variable=1, large=2, XL=3). Worker-Spawn-Timer existieren, bleiben aber gestoppt bis \`worker_automation\` erforscht und eine Worker-Fabrik errichtet wurde. - **SectorSystem (opt-in Dichte-Feld):** Neue Typen tragen bewusst das Präfix \`Sector*\` (Namenskollision mit dem Worker-Transit-System \`WorkerCluster\`/\`ClusterTierDefinition\`). Aktiv nur bei \`WorldConfig.sector_count > 0\` (\`resolved_sector_count()\`); \`SectorClassifier\` ist ein statischer \`RefCounted\` und wird von \`SeededLayout\` (endlicher Pfad) und \`ChunkCoordinator\` (unendlicher Pfad) aufgerufen. - **Sector-Größenwirkung ist rein visuell:** Skalierung ausschließlich über \`planet_visual_scale\`/\`resolved_planet_visual_scale()\` (0.6 im Shipped-Szenario) in beiden Pfaden — niemals \`set_size_profile\`, sonst bricht Worker-/Gameplay-Determinismus. Klassifikation landet als \`set_meta\` (\`sector_id\`/\`sector_role\`/\`sector_depth\`) auf den Planeten. - **Planet-Modul-Architektur:** \`planet.gd\` ist der zentrale Knotenpunkt und delegiert spezialisierte Aufgaben:   - \`PlanetArrivalResolver\` (\`scripts/objects/planets/planet_arrival_resolver.gd\`): Deterministische Arrival-, Missions- und Konfliktauflösung.   - \`PlanetTraitAggregator\` (\`scripts/objects/planets/planet_trait_aggregator.gd\`): Aggregation von Upgrade- und Trait-Boni.   - \`PlanetView\` (\`scripts/objects/planets/view/planet_view.gd\`): Reine CanvasItem-Zeichenroutinen (Faction-Ringe, StrengthLabels).   - \`PlanetProcedural\` (\`scripts/objects/planets/procedural/planet_procedural.gd\`): Komposition prozeduraler Planeten.   - \`ContextMenuBuilder\` (\`scripts/objects/planets/context_menu_builder.gd\`): Konstruktion und Gating des Rechtsklick-Kontextmenüs. - **GameState als Domain-Fassade:** \`GameState\` (/root/GameState) ist der zentrale SSOT für Besitz, Ressourcen, Forschung und Schiffe und delegiert an 4 Sub-Domänen (\`scripts/state/domains/\`):   - \`FactionDomain\`: Besitzverhältnisse, Homeworlds, Discovery, Scan-Intel, Starter-Scout.   - \`EconomyDomain\`: Faction-Vaults, Ressourcen-Deals, Upgrades, Worker-Factories, persistente Gatherer.   - \`TechDomain\`: Globale & planetare Technologien, Forschungs-Jobs, Voraussetzungen.   - \`ShipDomain\`: Teile-Inventare, Schiffsmontage (\`assemble_ship\`), Zerlegung, Bau-Jobs, FleetSnapshots. - **Ressourcen & Overdraft-Schutz:** Ressourcen sind unsichtbare \`GameResource\`-Datenobjekte aus dem \`ResourcePool\`. \`spend_faction_resource()\` blockiert bei unzureichendem Guthaben vollständig (kein Overdraft, keine Teilzahlung). - **Wirtschaft & Sammeltrupps:** Der Economy-Timer (10s) läuft erst nach \`worker_automation\`. Ein separater Gather-Timer (10s) läuft dauerhaft: \`collect\`-Missionen registrieren persistente Gatherer in \`GameState._gathering_workers\`, die pro Tick \`workers × resource_base\` einbringen. - **Navigation & Routing:** Pro Nachbarschaftskante existiert ein Moon-/Comet-Waypoint, überlagert von einem K-Nearest-Langstreckengraph (\`NavigationField\`). \`NavigationField.find_route()\` liefert den Pfad für Flugvorschau und Transit. - **Flugzeit & Cluster-Packing:** \`FlightTime.seconds_for()\` berechnet die Dauer basierend auf Distanz, Einheitenlast und Quell-Transfer-Speed. Worker-Transit packt nach Largest-First (K=1, M=5, L=100); alle Gruppen starten im selben Frame. - **UI-Stack:**   - \`PlanetNetworkUI\` (CanvasLayer 50): Komponiert \`VaultBar\` (\`scenes/ui/vault_bar.tscn\`) und \`PlanetPanel\` (\`scenes/ui/planet_panel.tscn\`).   - \`TechnologyMenu\` (CanvasLayer 60): Unterteilt in \`TechResearchView\`, \`TechScoutView\`, \`TechShipBuilderView\` und \`TechPlanetView\`. Schließt das PlanetPanel bei Öffnung.   - \`DossierLauncher\` (CanvasLayer 40): Drei Buttons (PLANET/WERKSTATT/FORSCHUNG) links oben, öffnen modale Dossier-Views via \`ModalCoordinator\`. Position y=48 (unter VaultBar).   - \`FleetOverview\` (CanvasLayer 38): Linksseitiges Schnellzugriffs-Panel für aktive Ships und selektierte Planeten, über \`ConflictManager.ship_dispatched\`/\`ship_arrived\`-Signals live aktualisiert.   - \`PauseMenu\` (CanvasLayer 70): Reagiert auf ESC (\`PROCESS_MODE_ALWAYS\`), wenn weder PlanetPanel noch TechMenu geöffnet sind. Bietet **SPEICHERN** (→ \`SaveGameService.save_run(0)\` + EventLog-Toast) und **HAUPTMENÜ** (→ erst unpausen, dann \`SceneDirectorService.goto_scene(\"menu\")\` — ein Scene-Wechsel im gepausten Baum würde das neue Menü einfrieren). Beide Buttons tragen stabile Namen (\`Content/SaveButton\`, \`Content/MenuButton\`) und sind über \`constraint_pause_and_context\` abgesichert.   - \`MainMenu\` (Einstiegsszene, \`run/main_scene\`): **NEUES SPIEL** (löscht Slot 0, \`GameState.request_new_run()\`, dann World), **WEITER** (deaktiviert ohne Save; \`SaveGameService.load_run(0)\` setzt \`_reconnect_requested\`, dann World), **BEENDEN**. Flow ist über \`constraint_main_menu_and_flow\` + \`constraint_context_handover\` abgesichert. - **Flottenkampf & Eroberung (Layer 2/3):**   - Layer 2: \`FleetBattleSimulator\` (deterministischer, getakteter \`RefCounted\`-Simulator) + \`BattleScene\` + \`IngamePlayerControls\`.   - Layer 3: \`ConquestSimulator\` (deterministischer \`RefCounted\`-Simulator für planetare Eroberung) + \`ConquestScene\`.   - \`ConquestSimulator.simulate_conquest\` darf HP/DPS-Konstanten nicht ändern — die bestehenden Layer-2/3-Preflight-Assertions koppeln exakt darauf. Nur \`tick\`/\`max_time\`/\`variance\` parametrisieren.   - Orchestrierung erfolgt über \`ConflictManager\` auf \`PlanetField\` und den \`SceneDirector\`. - **Modul-Schadensmodell (Layer 2/3):** \`FleetSnapshot.calculate_ship_stats\` liefert pro-Modul-Payloads (\`part_id\`/\`slot_type\`/\`trait\`/\`weight\`/\`hp\`/\`max_hp\`); nur montierte Module tragen HP. Event-Konvention in beiden Szenen: \`TYPE_MODULE_DESTROYED\` trägt die getroffene Einheit in \`source_id\`, \`TYPE_MODULE_HIT\` in \`target_id\` (L2: Ziel-           "user": "[IMPORTANT: The user has invoked the \"architecture-diagram\" skill, indicating they want you to follow its instructions. The full skill content is loaded below.]  --- name: architecture-diagram description: \"Dark-themed SVG architecture/cloud/infra diagrams as HTML.\" version: 1.0.0 author: Cocoon AI (hello@cocoon-ai.com), ported by Hermes Agent license: MIT dependencies: [] platforms: [linux, macos, windows] metadata:   hermes:     tags: [architecture, diagrams, SVG, HTML, visualization, infrastructure, cloud]     related_skills: [concept-diagrams, excalidraw] ---  # Architecture Diagram Skill  Generate professional, dark-themed technical architecture diagrams as standalone HTML files with inline SVG graphics. No external tools, no API keys, no rendering libraries — just write the HTML file and open it in a browser.  ## Scope  **Best suited for:** - Software system architecture (frontend / backend / database layers) - Cloud infrastructure (VPC, regions, subnets, managed services) - Microservice / service-mesh topology - Database + API map, deployment diagrams - Anything with a tech-infra subject that fits a dark, grid-backed aesthetic  **Look elsewhere first for:** - Physics, chemistry, math, biology, or other scientific subjects - Physical objects (vehicles, hardware, anatomy, cross-sections) - Floor plans, narrative journeys, educational / textbook-style visuals - Hand-drawn whiteboard sketches (consider \`excalidraw\`) - Animated explainers (consider an animation skill)  If a more specialized skill is available for the subject, prefer that. If none fits, this skill can also serve as a general SVG diagram fallback — the output will just carry the dark tech aesthetic described below.  Based on [Cocoon AI\'s architecture-diagram-generator](https://github.com/Cocoon-AI/architecture-diagram-generator) (MIT).  ## Workflow  1. User describes their system architecture (components, connections, technologies) 2. Generate the HTML file following the de unt Python files pygount --suffix=py --format=summary .  # Only count Python and YAML pygount --suffix=py,yaml,yml --format=summary . \`\`\`  ## 4. Detailed File-by-File Output  \`\`\`bash # Default format shows per-file breakdown pygount --folders-to-skip=\".git,node_modules,venv\" .  # Sort by code lines (pipe through sort) pygount --folders-to-skip=\".git,node_modules,venv\" . | sort -t$\'\\t\' -k1 -nr | head -20 \`\`\`  ## 5. Output Formats  \`\`\`bash # Summary table (default recommendation) pygount --format=summary .  # JSON output for programmatic use pygount --format=json .  # Pipe-friendly: Language, file count, code, docs, empty, string pygount --format=summary . 2>/dev/null \`\`\`  ## 6. Interpreting Results  The summary table columns: - **Language** — detected programming language - **Files** — number of files of that language - **Code** — lines of actual code (executable/declarative) - **Comment** — lines that are comments or documentation - **%** — percentage of total  Special pseudo-languages: - \`__empty__\` — empty files - \`__binary__\` — binary files (images, compiled, etc.) - \`__generated__\` — auto-generated files (detected heuristically) - \`__duplicate__\` — files with identical content - \`__unknown__\` — unrecognized file types  ## Pitfalls  1. **Always exclude .git, node_modules, venv** — without \`--folders-to-skip\`, pygount will crawl everything and may take minutes or hang on large dependency trees. 2. **Markdown shows 0 code lines** — pygount classifies all Markdown content as comments, not code. This is expected behavior. 3. **JSON files show low code counts** — pygount may count JSON lines conservatively. For accurate JSON line counts, use \`wc -l\` directly. 4. **Large monorepos** — for very large repos, consider using \`--suffix\` to target specific languages rather than scanning everything.  [Skill directory: C:\\Users\\Vannon\\AppData\\Local\\hermes\\skills\\github\\codebase-inspection] Resolve any relative paths in this skill ( // ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════
let level = 'platforms';
let ctx = null;
let bgCtx = null;
let W = 0, H = 0;
let bubbles = [];
let particles = [];
let hovered = null;
let history = [];
let currentCtx = null;
let time = 0;
let transitionProgress = 1;
let transitionFrom = [];
let targetBubbles = [];

// ═══════════════════════════════════════════════════════════════════════════
// PARTICLES (background)
// ═══════════════════════════════════════════════════════════════════════════
function initParticles() {
  particles = [];
  for (let i = 0; i < 60; i++) {
    particles.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.3 + 0.1,
    });
  }
}

function updateParticles() {
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    if (p.x < 0) p.x = W;
    if (p.x > W) p.x = 0;
    if (p.y < 0) p.y = H;
    if (p.y > H) p.y = 0;
  });
}

function drawParticles() {
  bgCtx.clearRect(0, 0, W, H);
  // Grid
  bgCtx.strokeStyle = 'rgba(255,255,255,0.02)';
  bgCtx.lineWidth = 0.5;
  for (let x = 0; x < W; x += 50) {
    bgCtx.beginPath(); bgCtx.moveTo(x, 0); bgCtx.lineTo(x, H); bgCtx.stroke();
  }
  for (let y = 0; y < H; y += 50) {
    bgCtx.beginPath(); bgCtx.moveTo(0, y); bgCtx.lineTo(W, y); bgCtx.stroke();
  }
  // Particles
  particles.forEach(p => {
    bgCtx.beginPath();
    bgCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(255,255,255,${p.alpha})`;
    bgCtx.fill();
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// BUBBLES
// ═══════════════════════════════════════════════════════════════════════════
function layoutBubbles(animate = false) {
  const prev = bubbles.map(b => ({x: b.x, y: b.y, r: b.r}));
  bubbles = [];

  if (level === 'platforms') {
    const total = DATA.platforms.reduce((s,p) => s + p.count, 0);
    DATA.platforms.forEach((p, i) => {
      const r = Math.sqrt(p.count / total) * Math.min(W, H) * 0.32;
      const angle = (i / DATA.platforms.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.28;
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: Math.max(r, 28), color: p.color, label: p.name,
        sub: p.count + ' Threads', data: p, type: 'platform',
        phase: Math.random() * Math.PI * 2, // for floating animation
      });
    });
  } else if (level === 'projects') {
    const projs = currentCtx?.platform
      ? DATA.projects.filter(p => p.platform === currentCtx.platform.id)
      : DATA.projects;
    projs.forEach((p, i) => {
      const r = Math.sqrt(p.threads / 109) * Math.min(W, H) * 0.22;
      const angle = (i / projs.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.25;
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: Math.max(r, 32), color: p.color, label: p.name,
        sub: p.threads + ' Threads', data: p, type: 'project',
        phase: Math.random() * Math.PI * 2,
      });
    });
  } else if (level === 'threads') {
    const proj = currentCtx?.project;
    const threads = proj?.threadList?.length > 0 ? proj.threadList : [
      {id:'g1',title:'Beispiel-Thread',platform:proj?.platform||'?',date:'2026-08-27',cats:['FEATURE'],user:'Input',agent:'Antwort',commit:null},
    ];
    threads.forEach((t, i) => {
      const angle = (i / threads.length) * Math.PI * 2 - Math.PI / 2;
      const dist = Math.min(W, H) * 0.22;
      const catColor = t.cats?.includes('BUG') ? '#ef4444' : t.cats?.includes('FEATURE') ? '#10b981' : '#8b5cf6';
      bubbles.push({
        x: W/2 + Math.cos(angle) * dist, y: H/2 + Math.sin(angle) * dist,
        r: 35, color: catColor, label: t.title.substring(0, 20),
        sub: t.platform, data: t, type: 'thread',
        phase: Math.random() * Math.PI * 2,
      });
    });
  }

  // Animate from previous positions
  if (animate && prev.length > 0) {
    bubbles.forEach((b, i) => {
      if (i < prev.length) {
        b.x = prev[i].x;
        b.y = prev[i].y;
        b.r = prev[i].r;
      }
    });
    transitionProgress = 0;
    transitionFrom = prev.map(p => ({...p}));
    targetBubbles = bubbles.map(b => ({x: b.x, y: b.y, r: b.r}));
  }
}

function draw() {
  time += 0.016;
  ctx.clearRect(0, 0, W, H);

  // Animate transition
  if (transitionProgress < 1) {
    transitionProgress = Math.min(1, transitionProgress + 0.04);
    const ease = 1 - Math.pow(1 - transitionProgress, 3); // easeOutCubic
    bubbles.forEach((b, i) => {
      if (i < targetBubbles.length && i < transitionFrom.length) {
        b.x = transitionFrom[i].x + (targetBubbles[i].x - transitionFrom[i].x) * ease;
        b.y = transitionFrom[i].y + (targetBubbles[i].y - transitionFrom[i].y) * ease;
        b.r = transitionFrom[i].r + (targetBubbles[i].r - transitionFrom[i].r) * ease;
      }
    });
  }

  // Floating animation
  bubbles.forEach(b => {
    b.x += Math.sin(time * 0.8 + b.phase) * 0.3;
    b.y += Math.cos(time * 0.6 + b.phase * 1.3) * 0.2;
  });

  // Draw connections
  ctx.lineWidth = 0.5;
  for (let i = 0; i < bubbles.length; i++) {
    for (let j = i + 1; j < bubbles.length; j++) {
      const a = bubbles[i], b = bubbles[j];
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      if (dist < 350) {
        const alpha = (1 - dist / 350) * 0.2;
        const gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        gradient.addColorStop(0, a.color + Math.round(alpha * 255).toString(16).padStart(2,'0'));
        gradient.addColorStop(1, b.color + Math.round(alpha * 255).toString(16).padStart(2,'0'));
        ctx.strokeStyle = gradient;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    }
  }

  // Draw bubbles
  bubbles.forEach(b => {
    const isH = hovered === b;
    const pulse = 1 + Math.sin(time * 2 + b.phase) * 0.02;
    const scale = isH ? 1.1 : pulse;
    const r = b.r * scale;

    // Outer glow (animated)
    const glowR = r * (1.4 + Math.sin(time * 1.5 + b.phase) * 0.1);
    const grad = ctx.createRadialGradient(b.x, b.y, r * 0.5, b.x, b.y, glowR);
    grad.addColorStop(0, b.color + '25');
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(b.x, b.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Main circle
    ctx.fillStyle = b.color + (isH ? '35' : '20');
    ctx.strokeStyle = b.color + (isH ? 'dd' : '70');
    ctx.lineWidth = isH ? 2.5 : 1.5;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Inner ring pulse
    ctx.strokeStyle = b.color + '30';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r * (0.85 + Math.sin(time * 3 + b.phase) * 0.05), 0, Math.PI * 2);
    ctx.stroke();

    // Pie slice (for projects)
    if (b.type === 'project' && b.data.cats) {
      const cats = Object.entries(b.data.cats);
      const total = cats.reduce((s,[,v]) => s + v, 0);
      let ang = -Math.PI / 2;
      cats.forEach(([,count]) => {
        const sweep = (count / total) * Math.PI * 2;
        ctx.fillStyle = b.color + '35';
        ctx.beginPath();
        ctx.moveTo(b.x, b.y);
        ctx.arc(b.x, b.y, r * 0.65, ang, ang + sweep);
        ctx.closePath();
        ctx.fill();
        ang += sweep;
      });
    }

    // Labels
    ctx.fillStyle = '#fafafa';
    ctx.font = `${isH ? '600' : '500'} ${Math.max(10, r * 0.18)}px Inter, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y - r * 0.08);

    ctx.fillStyle = '#71717a';
    ctx.font = `400 ${Math.max(8, r * 0.13)}px "JetBrains Mono", monospace`;
    ctx.fillText(b.sub, b.x, b.y + r * 0.15);

    // Click hint on hover
    if (isH && b.type !== 'thread') {
      ctx.fillStyle = b.color + 'aa';
      ctx.font = '500 9px Inter';
      ctx.fillText('Klicken zum Zoomen \u2192', b.x, b.y + r * 0.35);
    }
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// ANIMATION LOOP
// ═══════════════════════════════════════════════════════════════════════════
function loop() {
  updateParticles();
  drawParticles();
  draw();
  requestAnimationFrame(loop);
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════════
const mainCanvas = document.getElementById('mainCanvas');
const tooltip = document.getElementById('tooltip');

mainCanvas.addEventListener('mousemove', e => {
  const rect = mainCanvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  hovered = null;
  for (const b of bubbles) {
    if (Math.hypot(mx - b.x, my - b.y) < b.r) { hovered = b; break; }
  }
  mainCanvas.style.cursor = hovered ? 'pointer' : 'default';
  if (hovered) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX + 14) + 'px';
    tooltip.style.top = (e.clientY + 14) + 'px';
    tooltip.innerHTML = `<div class="tt-title">${hovered.label}</div>
      <div class="tt-row"><span>Typ</span><span>${hovered.type}</span></div>
      <div class="tt-row"><span>Daten</span><span>${hovered.sub}</span></div>
      ${hovered.type !== 'thread' ? '<div style="margin-top:6px;color:var(--accent);font-size:10px">Klicken zum Zoomen</div>' : '<div style="margin-top:6px;color:var(--accent3);font-size:10px">Klicken fuer Details</div>'}`;
  } else {
    tooltip.style.display = 'none';
  }
});

mainCanvas.addEventListener('click', () => {
  if (!hovered) return;
  const b = hovered;
  history.push({level, ctx: currentCtx});

  if (b.type === 'platform') {
    level = 'projects';
    currentCtx = {platform: b.data};
  } else if (b.type === 'project') {
    level = 'threads';
    currentCtx = {...currentCtx, project: b.data};
  } else if (b.type === 'thread') {
    showDetail(b.data);
    history.pop(); // don't save thread click in history
    return;
  }

  updateBreadcrumb();
  updateSidePanel();
  layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
});

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  level = prev.level;
  currentCtx = prev.ctx;
  updateBreadcrumb();
  updateSidePanel();
  layoutBubbles(true);
  if (!history.length) document.getElementById('backBtn').classList.remove('visible');
}

// ═══════════════════════════════════════════════════════════════════════════
// BREADCRUMB
// ═══════════════════════════════════════════════════════════════════════════
function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  let h = `<div class="bc-item${level==='platforms'?' active':''}" onclick="navTo('platforms')">PRISM</div>`;
  if (currentCtx?.platform) {
    h += `<span class="bc-sep">&#9656;</span><div class="bc-item${level==='projects'?' active':''}" onclick="navTo('projects','${currentCtx.platform.id}')">${currentCtx.platform.name}</div>`;
  }
  if (currentCtx?.project) {
    h += `<span class="bc-sep">&#9656;</span><div class="bc-item active">${currentCtx.project.name}</div>`;
  }
  bc.innerHTML = h;
}

function navTo(lvl, pid) {
  history.push({level, ctx: currentCtx});
  if (lvl === 'platforms') { level = 'platforms'; currentCtx = null; }
  else if (lvl === 'projects') { level = 'projects'; currentCtx = {platform: DATA.platforms.find(p=>p.id===pid)}; }
  updateBreadcrumb(); updateSidePanel(); layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
}

// ═══════════════════════════════════════════════════════════════════════════
// SIDE PANEL
// ═══════════════════════════════════════════════════════════════════════════
function switchTab(btn, tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function updateSidePanel() {
  const s = document.getElementById('headerStats');
  if (level === 'platforms') {
    s.innerHTML = `<div class="stat blue"><div class="val">${DATA.stats.threads}</div><div class="lbl">Threads</div></div><div class="stat green"><div class="val">${DATA.stats.answered}</div><div class="lbl">Beantwortet</div></div><div class="stat red"><div class="val">${DATA.stats.open}</div><div class="lbl">Offen</div></div><div class="stat amber"><div class="val">${DATA.stats.interrupts}</div><div class="lbl">Interrupts</div></div><div class="stat purple"><div class="val">${DATA.stats.rate}%</div><div class="lbl">Rate</div></div>`;
  } else if (level === 'projects' && currentCtx?.platform) {
    const ps = DATA.projects.filter(p=>p.platform===currentCtx.platform.id);
    s.innerHTML = `<div class="stat blue"><div class="val">${ps.reduce((s,p)=>s+p.threads,0)}</div><div class="lbl">Threads</div></div><div class="stat green"><div class="val">${ps.length}</div><div class="lbl">Projekte</div></div>`;
  } else if (level === 'threads' && currentCtx?.project) {
    s.innerHTML = `<div class="stat blue"><div class="val">${currentCtx.project.threads}</div><div class="lbl">Threads</div></div>`;
  }
  updateOverview(); updateProjects(); updateThreads(); updateTimeline(); updateIntegrity();
}

function updateOverview() {
  const g = document.getElementById('overviewGrid');
  g.innerHTML = `<div class="ov-card"><div class="val" style="color:var(--accent)">${DATA.stats.threads}</div><div class="lbl">Gesamt</div></div><div class="ov-card"><div class="val" style="color:var(--accent2)">${DATA.stats.answered}</div><div class="lbl">Vollstaendig</div></div><div class="ov-card"><div class="val" style="color:var(--err)">${DATA.stats.open}</div><div class="lbl">Ohne Agent</div></div><div class="ov-card"><div class="val" style="color:var(--warn)">${DATA.stats.interrupts}</div><div class="lbl">Interrupts</div></div>`;
  const bar = document.getElementById('integrityBar');
  bar.innerHTML = `<div style="width:${(DATA.stats.answered/DATA.stats.threads*100).toFixed(1)}%;background:var(--accent2);border-radius:3px"></div><div style="width:${(DATA.stats.interrupts/DATA.stats.threads*100).toFixed(1)}%;background:var(--warn)"></div><div style="width:${(DATA.stats.open/DATA.stats.threads*100).toFixed(1)}%;background:var(--err)"></div>`;
  document.getElementById('platformList').innerHTML = DATA.platforms.map(p => `<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:6px 8px;background:var(--bg3);border-radius:var(--radius-sm);cursor:pointer;transition:all 0.2s" onmouseover="this.style.transform='translateX(4px)'" onmouseout="this.style.transform=''" onclick="navTo('projects','${p.id}')"><div style="width:8px;height:8px;border-radius:50%;background:${p.color}"></div><span style="font-size:12px;font-weight:500;flex:1">${p.name}</span><span style="font-size:11px;color:var(--text3)">${p.count}</span></div>`).join('');
}

function updateProjects() {
  const ps = currentCtx?.platform ? DATA.projects.filter(p=>p.platform===currentCtx.platform.id) : DATA.projects;
  document.getElementById('projectList').innerHTML = ps.map(p => {
    const top = Object.entries(p.cats||{}).sort((a,b)=>b[1]-a[1])[0];
    return `<div class="proj-card" onclick="clickProj('${p.name}')"><div class="proj-head"><span class="proj-name">${p.name}</span><span class="proj-pct" style="color:${p.color}">${p.threads}</span></div><div class="proj-bar"><div class="proj-bar-fill" style="width:${p.threads/109*100}%;background:${p.color}"></div></div><div class="proj-meta"><span class="proj-tag">${top?top[0]:'N/A'}</span><span class="proj-tag">${p.platform}</span></div></div>`;
  }).join('');
}

function updateThreads() {
  let ts = [];
  if (currentCtx?.project) ts = currentCtx.project.threadList;
  else if (currentCtx?.platform) DATA.projects.filter(p=>p.platform===currentCtx.platform.id).forEach(p=>ts.push(...p.threadList));
  else DATA.projects.forEach(p=>ts.push(...p.threadList));
  document.getElementById('threadList').innerHTML = ts.map(t => {
    const plat = DATA.platforms.find(p=>p.id===t.platform);
    return `<div class="thread-card" onclick="clickThread('${t.id}')"><div class="thread-head"><span class="thread-title">${t.title}</span><span class="thread-platform" style="background:${plat?.color||'var(--bg3)'}22;color:${plat?.color||'var(--text3)'}">${t.platform}</span></div><div class="thread-meta"><span class="thread-tag">${t.cats?.join(', ')||''}</span><span>${t.date}</span>${t.commit?'<span class="commit-badge">\u2713 '+t.commit+'</span>':''}</div><div class="thread-snippet">${t.user}</div></div>`;
  }).join('');
}

function updateTimeline() {
  document.getElementById('timelineList').innerHTML = DATA.timeline.map(d => `<div style="margin-bottom:16px"><div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px">${d.date} <span style="background:var(--bg3);border-radius:12px;padding:2px 10px;font-size:10px;color:var(--text2)">${d.commits.length} Commits</span></div>${d.commits.map(c=>`<div style="display:flex;gap:8px;padding:4px 0 4px 16px;border-left:2px solid var(--border)"><span class="mono" style="color:var(--accent2);font-size:11px">${c.hash}</span><span style="font-size:12px;color:var(--text2)">${c.msg}</span></div>`).join('')}</div>`).join('');
}

function updateIntegrity() {
  document.getElementById('integrityIssues').innerHTML = `<div style="margin-bottom:12px;font-size:11px;font-weight:600;color:var(--err)">${DATA.noAgent.length} Threads ohne Agent-Antwort</div>${DATA.noAgent.map(t=>`<div style="background:var(--bg3);border-left:3px solid var(--err);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:10px 12px;margin-bottom:6px"><div style="font-size:12px;font-weight:500">${t.title}</div><div style="font-size:10px;color:var(--text3);margin-top:4px">${t.platform} \u00b7 ${t.date}</div><div style="font-size:11px;color:var(--text2);margin-top:4px">Input: "${t.user}"</div></div>`).join('')}`;
}

// ═══════════════════════════════════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════════════════════════════════
function showDetail(t) {
  document.getElementById('detailTitle').textContent = t.title;
  document.getElementById('detailContent').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap"><span style="background:var(--bg3);border-radius:4px;padding:2px 8px;font-size:10px;color:var(--accent3)">${t.platform}</span><span style="font-size:11px;color:var(--text3)">${t.date}</span>${(t.cats||[]).map(c=>`<span style="background:var(--bg3);border-radius:4px;padding:2px 8px;font-size:10px;color:var(--accent)">${c}</span>`).join('')}${t.commit?`<span class="commit-badge">\u2713 ${t.commit}</span>`:''}</div><div class="msg-card"><div class="msg-role user">User Input</div><div class="msg-content">${t.user}</div></div><div class="msg-card"><div class="msg-role assistant">Agent Antwort</div><div class="msg-content">${t.agent}</div></div>`;
  document.getElementById('detailPanel').classList.add('visible');
}

function closeDetail() { document.getElementById('detailPanel').classList.remove('visible'); }

function clickProj(name) {
  const p = DATA.projects.find(x=>x.name===name);
  if (!p) return;
  history.push({level, ctx: currentCtx});
  level = 'threads'; currentCtx = {...currentCtx, project: p};
  updateBreadcrumb(); updateSidePanel(); layoutBubbles(true);
  document.getElementById('backBtn').classList.add('visible');
}

function clickThread(id) {
  for (const p of DATA.projects) {
    const t = p.threadList.find(x=>x.id===id);
    if (t) { showDetail(t); return; }
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
function resize() {
  const rect = document.querySelector('.canvas-area').getBoundingClientRect();
  W = rect.width; H = rect.height;
  const dpr = window.devicePixelRatio || 1;
  [document.getElementById('bgCanvas'), mainCanvas].forEach(c => {
    c.width = W * dpr; c.height = H * dpr;
    c.style.width = W + 'px'; c.style.height = H + 'px';
  });
  bgCtx = document.getElementById('bgCanvas').getContext('2d');
  ctx = mainCanvas.getContext('2d');
  bgCtx.scale(dpr, dpr);
  ctx.scale(dpr, dpr);
  initParticles();
  layoutBubbles();
}

window.addEventListener('resize', resize);
resize();
updateBreadcrumb();
updateSidePanel();
loop();
</script>
</body>
</html>
